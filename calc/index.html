<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3E6A7C">
<meta name="description" content="木子澄安診所臨床工具：BMI、BMR/TDEE、FIB-4 肝纖維化、R Factor 肝損傷型態、Child-Pugh 肝硬化分級、Bristol 糞便型態，以及胃酸逆流、脂肪肝、大腸癌風險、代謝症候群、糖尿病前期等自我評估。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233E6A7C'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E木%3C/text%3E%3C/svg%3E">
<title>木子澄安診所 臨床計算與自我評估工具</title>
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="木子澄安診所">
<meta property="og:title" content="木子澄安診所 臨床計算與自我評估工具">
<meta property="og:description" content="胃酸逆流、脂肪肝、大腸癌風險、糞便型態與顏色、代謝症候群、糖尿病前期等自我評估，所有計算都在您的裝置上完成。">
<meta property="og:url" content="https://adigu2025.github.io/tools/calc/">
<meta name="twitter:card" content="summary">
<style>
html{overflow-y:scroll;-webkit-text-size-adjust:100%;}
body{margin:0;background:#EDF2F4;}
</style>
</head>
<body>
<!-- 畫面在 view.html（與工作台共用），由 ../mount.js 放進這裡 -->
<div id="calc-host"></div>
<noscript><p style="padding:24px">請開啟 JavaScript 才能使用計算與自我評估工具。</p></noscript>
<script src="../mount.js"></script>
<script>
let CD = null, CB = null;
mountView(document.getElementById('calc-host'), 'view.html', {
  onRoot: root=>{ CD = root; CB = root.getElementById('c-body'); },
  scripts: ['app.js']
}).catch(err=>{
  console.error(err);
  document.getElementById('calc-host').innerHTML = '<p style="padding:24px">載入失敗，請重新整理頁面。</p>';
});
// 離線快取：診所或病人網路不穩時仍可開啟
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  navigator.serviceWorker.register('../sw.js', {scope:'../'}).catch(()=>{});
}
</script>
</body>
</html>

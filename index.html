<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木子澄安診所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<script>
/* 開頁就同時下載四個工具的畫面與程式，不必等前一個裝好才開始抓下一個（減重與健檢報告共用的 lab/lab.js、kit/report-kit.js 先執行） */
(function(){
  var base = location.protocol === 'file:' ? 'https://adigu2025.github.io/tools/' : './';
  [['quote/view.html','fetch'],['quote/hub.css','fetch'],['quote/app.js','script'],
   ['calc/view.html','fetch'],['weight/view.html','fetch'],['checkup/view.html','fetch'],['calc/hub.css','fetch'],
   ['lab/lab.js','script'],['kit/report-kit.js','script'],['weight/app.js','script'],['weight/report.js','script'],
   ['checkup/app.js','script'],['checkup/report.js','script'],['calc/rules.js','script'],['calc/app.js','script']].forEach(function(p){
    var l = document.createElement('link');
    l.rel = 'preload'; l.href = base + p[0]; l.as = p[1];
    if(p[1] === 'fetch') l.crossOrigin = 'anonymous';
    document.head.appendChild(l);
  });
})();
</script>
<style>
/* 配色：暖白底、墨色文字、陶土色點綴。狀態色（綠／橘／紅）留給各工具的判讀結果使用，介面本身不搶色。 */
:root{
  --bg:#F5F4EE; --surface:#FFFFFF; --surface-alt:#FAF9F5; --sunken:#EFEDE6;
  --line:#E6E3DA; --line-strong:#D6D2C6;
  --ink:#1F1E1D; --ink-2:#3A3935; --muted:#6F6B63; --faint:#9C978C;
  --clay:#C96442; --clay-dark:#A9502F; --clay-soft:#F6EBE4;
  --serif:"Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --shadow:0 1px 2px rgba(31,30,29,.04), 0 6px 24px rgba(31,30,29,.06);
  --bar-h:80px; --foot-h:30px;
}
/* 臨床計算用灰紫；其餘四個分頁各用一個霍格華茲學院的代表色（主色＋輔色），只用在分頁、選取狀態、主要按鈕與細線；
   大面積底色維持暖白，內文維持墨色，閱讀舒適度不受影響。
   --acc 主色（填色）、--acc-fg 主色上的文字、--acc-2 輔色（細線、指示條）、--acc-soft 淡底、--acc-text 白底上可讀的強調字色。
   赫夫帕夫的黃色當底時字用黑色；史萊哲林的銀色太淺，指示條改用較深的銀灰。
   色調採莫蘭迪感：原色降低彩度、略提亮度，主色上的白字仍維持 4.5:1 以上。
   選中的分頁與「列印」按鈕用淡底＋深色字，滑過時才填主色，畫面不厚重。 */
body{--acc:#5B6B8C; --acc-fg:#fff; --acc-2:#A88A62; --acc-soft:#E8ECF3; --acc-text:#3E4C6B;}         /* 報價：雷文克勞 藍＋銅 */
body[data-view="calc"]{--acc:#7D6A8E; --acc-fg:#fff; --acc-2:#B0894F; --acc-soft:#EEE9F2; --acc-text:#5C4A6D;}   /* 臨床計算：灰紫＋淡金 */
body[data-view="weight"]{--acc:#E2C477; --acc-fg:#4A4038; --acc-2:#4A4038; --acc-soft:#F6EDD3; --acc-text:#6B5520;} /* 製作報告：赫夫帕夫 黃＋黑 */
body[data-view="edu"]{--acc:#9B5A57; --acc-fg:#fff; --acc-2:#C9A96A; --acc-soft:#F3E6E4; --acc-text:#7A3F3D;}       /* 衛教圖卡：葛來分多 紅＋金 */
body[data-view="print"]{--acc:#587562; --acc-fg:#fff; --acc-2:#A3A8AB; --acc-soft:#E5EDE7; --acc-text:#3F5A48;}     /* 列印表單：史萊哲林 綠＋銀 */
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
button{font:inherit; cursor:pointer; color:inherit;}
:focus-visible{outline:2px solid var(--acc-text); outline-offset:2px; border-radius:8px;}

/* ── 頂端列 ── */
.hub-bar{height:var(--bar-h); display:flex; align-items:center; gap:18px; padding:0 22px;
  background:var(--surface-alt); border-bottom:1px solid var(--line); box-shadow:inset 0 -3px 0 var(--acc);}
.qr-btn{width:52px; height:52px; padding:4px; border:1px solid var(--line); border-radius:12px; background:#fff; flex:none;}
.qr-btn:hover{border-color:var(--line-strong);}
.qr-btn img{width:100%; height:100%; display:block;}
.hub-brand{white-space:nowrap; font-family:var(--serif); font-size:28px; font-weight:700; letter-spacing:.1em;
  line-height:1; margin:0 6px 0 2px;}
.hub-tabs{display:flex; gap:2px; background:var(--sunken); padding:4px; border-radius:14px;}
.hub-tab{border:0; background:transparent; color:var(--muted); padding:9px 20px; border-radius:10px;
  font-size:16.5px; font-weight:500; white-space:nowrap;}
.hub-tab:hover{color:var(--ink);}
.hub-tab[aria-selected="true"]{background:var(--acc-soft); color:var(--acc-text); font-weight:700;
  box-shadow:0 1px 2px rgba(31,30,29,.08), 0 2px 8px rgba(31,30,29,.06);}
/* 分頁圖示：來源是主 repo 的「圖示」資料夾（icons.js），滑過時有小動畫。
   改成各分頁的學院色：線條用深色（--dot-ink），紙白部分用淡色，其餘填色用學院色（--dot），不畫暗面 */
.hub-tab[data-view="quote"]{--dot:#5B6B8C; --dot-ink:#3E4C6B;} .hub-tab[data-view="calc"]{--dot:#7D6A8E; --dot-ink:#5C4A6D;} .hub-tab[data-view="weight"]{--dot:#E2C477; --dot-ink:#6B5520;}
.hub-tab[data-view="edu"]{--dot:#9B5A57; --dot-ink:#7A3F3D;} .hub-tab[data-view="print"]{--dot:#587562; --dot-ink:#3F5A48;}
.hub-tab .ic{width:20px; height:20px; margin-right:8px; vertical-align:-4px; color:var(--dot-ink);}
.hub-tab .ic [fill]:not([fill="none"]){fill:var(--dot);}
.hub-tab .ic [fill="#FFFFFF"]:not([fill="none"]){fill:color-mix(in srgb, var(--dot) 22%, #fff);}
.hub-tab .ic [stroke]:not([stroke="none"]):not([stroke="#FFFFFF"]){stroke:currentColor;}
.hub-tab .ic [clip-path]{display:none;}
.ic [class*='a-']{transform-box:fill-box;transform-origin:50% 50%;animation-duration:.7s;animation-timing-function:cubic-bezier(.3,.7,.4,1);animation-fill-mode:both}.ic .a-draw{stroke-dasharray:1 1}.ic .a-fill{transform-origin:50% 100%}.ic .a-fan,.ic .a-swing{transform-origin:0 100%}.ic .a-sway{transform-origin:76% 23%}.ic .a-drop,.ic .a-flow,.ic .a-scope{animation-iteration-count:infinite;animation-timing-function:linear;animation-duration:1.1s}.ic .a-scope{animation-duration:2.6s}.ic .a-blink{animation-iteration-count:2;animation-duration:.6s}.ic .d2{animation-delay:.12s}.ic .d3{animation-delay:.24s}.ic .d4{animation-delay:.36s}@media (prefers-reduced-motion:no-preference){.ic:hover .a-draw,:hover>.ic .a-draw{animation-name:mz-draw}.ic:hover .a-blink,:hover>.ic .a-blink{animation-name:mz-blink}.ic:hover .a-wave,:hover>.ic .a-wave{animation-name:mz-wave}.ic:hover .a-fill,:hover>.ic .a-fill{animation-name:mz-fill}.ic:hover .a-drop,:hover>.ic .a-drop{animation-name:mz-drop}.ic:hover .a-swing,:hover>.ic .a-swing{animation-name:mz-swing}.ic:hover .a-sway,:hover>.ic .a-sway{animation-name:mz-sway}.ic:hover .a-fan,:hover>.ic .a-fan{animation-name:mz-fan}.ic:hover .a-feed,:hover>.ic .a-feed{animation-name:mz-feed}.ic:hover .a-pulse,:hover>.ic .a-pulse{animation-name:mz-pulse}.ic:hover .a-flow,:hover>.ic .a-flow{animation-name:mz-flow}.ic:hover .a-scope,:hover>.ic .a-scope{animation-name:mz-scope}.ic:hover .a-write,:hover>.ic .a-write{animation-name:mz-write}.ic:hover .a-stamp,:hover>.ic .a-stamp{animation-name:mz-stamp}.ic:hover .a-pop,:hover>.ic .a-pop{animation-name:mz-pop}}@keyframes mz-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes mz-blink{50%{opacity:.15}}@keyframes mz-wave{from{transform:translateY(-1.5px);opacity:0}}@keyframes mz-fill{from{transform:scaleY(.5)}}@keyframes mz-drop{0%{transform:translateY(-1px);opacity:0}30%{opacity:1}100%{transform:translateY(2.2px);opacity:0}}@keyframes mz-swing{40%{transform:rotate(-22deg)}75%{transform:rotate(8deg)}}@keyframes mz-sway{35%{transform:rotate(9deg)}70%{transform:rotate(-5deg)}}@keyframes mz-fan{50%{transform:rotate(8deg)}}@keyframes mz-feed{from{transform:translateY(-2.5px)}}@keyframes mz-pulse{50%{transform:scale(1.3)}}@keyframes mz-flow{to{stroke-dashoffset:-8}}@keyframes mz-scope{to{stroke-dashoffset:-29}}@keyframes mz-write{25%,75%{transform:translate(-1.5px,1px)}50%{transform:translate(0,0)}}@keyframes mz-stamp{from{transform:scale(1.4);opacity:0}}@keyframes mz-pop{from{transform:scale(.55);opacity:.3}}
.hub-tab[aria-selected="true"] kbd{color:inherit; opacity:.7;}
.hub-tab kbd{font:inherit; font-size:11px; color:var(--faint); margin-left:7px; font-weight:400;}
.hub-chips{display:flex; gap:8px; flex:1; min-width:0; overflow:hidden; justify-content:flex-end;}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 14px;
  font-size:15px; white-space:nowrap; color:var(--ink-2);}
.chip:hover{border-color:var(--line-strong);}
.chip .k{color:var(--muted); font-size:13px; margin-right:6px;}
.chip b{font-size:17px; font-weight:700; color:var(--ink);}
.chip[hidden]{display:none;}
.chip .save{margin-left:10px; font-size:12.5px; padding:2px 8px; border-radius:999px; background:var(--clay-soft); color:var(--clay-dark);}
.chip .save.ok{background:#E9F2EA; color:#2F6B3F;}
.hub-actions{display:flex; gap:10px;}
.btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:10px; padding:9px 16px;
  font-size:15px; white-space:nowrap; color:var(--ink);}
.btn:hover{background:var(--sunken);}
.btn[aria-pressed="true"]{background:var(--acc); border-color:var(--acc); color:var(--acc-fg);}
.btn.clear{border-color:var(--clay); color:var(--clay-dark); font-weight:700;}
.btn.clear:hover{background:var(--clay); color:#fff;}
.btn[hidden]{display:none;}

/* ── 主區：四個面板疊在同一格，只切換可見度。
   用 visibility 而非 display:none，隱藏中的工具仍保有版面，背景列印與匯出 PDF 才不會出錯。 ── */
.hub-main{position:relative; height:calc(100dvh - var(--bar-h) - var(--foot-h)); display:grid;
  grid-template-columns:1fr; grid-template-areas:"main";}
.pane{grid-area:main; min-height:0; min-width:0; visibility:hidden; pointer-events:none;}
/* 報價直接放在工作台裡（quote/view.html 裝進 #quote-host 的 shadow root）。準備好之前先遮住，不會看到原本的外觀再跳成工作台外觀 */
#quote-host{display:block; height:100%; background:var(--bg);}
#quote-host.loading{opacity:0;}
/* 列印報價單時只印報價這一區（window.QUOTE_PRINT 加上 body.print-quote），版面由報價工具自己的列印樣式決定 */
@media print{
  body.print-quote .hub-bar, body.print-quote .hub-foot, body.print-quote .toast, body.print-quote .pane:not(#pane-quote){display:none !important;}
  html:has(body.print-quote), body.print-quote{height:auto; background:#fff;}
  body.print-quote .hub-main{display:block; height:auto;}
  body.print-quote #pane-quote{visibility:visible; height:auto;}
  body.print-quote #quote-host{height:auto;}
}
/* 報價的說明文件最大化時，工作台的頂端列與底列一起收起 */
body.q-max .hub-bar, body.q-max .hub-foot{display:none;}
body.q-max .hub-main{height:100dvh;}
/* 臨床計算直接放在工作台裡（calc/view.html 裝進 #calc-host 的 shadow root）。
   準備好之前先遮住（保留版面，量測字級才準），避免看到排版調整的過程 */
#calc-host{display:block; height:100%; background:var(--bg);}
#calc-host.loading{opacity:0;}
/* 列印「已完成的評估」時只印臨床計算這一區（window.CALC_PRINT 加上 body.print-calc） */
@media print{
  body.print-calc .hub-bar, body.print-calc .hub-foot, body.print-calc .toast, body.print-calc .pane:not(#pane-calc){display:none !important;}
  html:has(body.print-calc), body.print-calc{height:auto; background:#fff;}
  body.print-calc .hub-main{display:block; height:auto;}
  body.print-calc #pane-calc{visibility:visible; height:auto;}
  body.print-calc #calc-host{height:auto;}
}
/* 製作報告：先選報告種類。減重報告直接放在工作台裡（weight/view.html 裝進 #weight-host 的 shadow root，
   樣式互不影響）；一直留在底下保有版面，只是不顯示 */
#pane-weight{position:relative;}
#weight-host{display:block; height:100%; background:var(--bg);}
#weight-host.loading{opacity:0;}
.hub-main:not([data-rep="weight"]) #weight-host{visibility:hidden;}
.rep-layer{position:absolute; inset:0; overflow:auto; padding:18px; background:var(--bg); display:none;}
.hub-main[data-rep="home"] #rep-home, .hub-main[data-rep="checkup"] #rep-checkup{display:block;}
/* 健檢報告：checkup/view.html 裝進 #checkup-host 的 shadow root，捲動在裡面處理 */
#rep-checkup{padding:0; overflow:hidden;}
#checkup-host{display:block; height:100%;}
#checkup-host.loading{opacity:0;}
.rep-wrap{max-width:1100px; margin:0 auto;}
.rep-head{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; padding:10px 4px 18px;}
.rep-head h1{font-family:var(--serif); font-size:26px; margin:0; letter-spacing:.03em;}
.rep-head p{margin:0; color:var(--muted); font-size:15px;}
/* 報告種類卡片：接近方形，上半部是一疊 A4 報告的縮圖（看得出會產出什麼），下半部是名稱與說明。
   不用底色方塊圖示，也不用有色陰影；靜止時只有細框線，滑過時框線加深、最上面那一頁略微抬起 */
.rep-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,340px)); gap:22px;}
.rep-card{display:flex; flex-direction:column; text-align:left; padding:0; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; transition:border-color .2s;}
.rep-card:hover{border-color:var(--faint);}
.rep-art{height:200px; background:var(--surface-alt); border-bottom:1px solid var(--line); display:grid; place-items:center;}
.rep-art svg{width:220px; height:180px; display:block; overflow:visible;}
.rep-art .sheet{fill:#fff; stroke:var(--line-strong); stroke-width:1;}
.rep-art .back{transform-box:fill-box; transform-origin:50% 100%; transform:rotate(5deg); transition:transform .3s ease;}
.rep-art .front{transition:transform .3s ease;}
.rep-art .ink{fill:var(--ink-2);} .rep-art .mute{fill:var(--line-strong);} .rep-art .faint{fill:var(--sunken);}
.rep-art .acc{fill:var(--acc-text);} .rep-art .acc-l{stroke:var(--acc-text); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
.rep-art .ring{fill:none; stroke:var(--line-strong); stroke-width:1;}
@media (prefers-reduced-motion:no-preference){
  .rep-card:hover .front{transform:translateY(-5px);}
  .rep-card:hover .back{transform:rotate(8deg);}
}
.rep-txt{padding:20px 24px 0; display:flex; flex-direction:column; gap:6px; flex:1;}
.rep-txt b{font-family:var(--serif); font-size:23px; letter-spacing:.04em; color:var(--ink);}
.rep-txt small{font-size:14.5px; color:var(--muted); line-height:1.65;}
.rep-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 24px 0; padding:12px 0 16px;
  border-top:1px solid var(--line); font-size:13.5px; color:var(--faint);}
.rep-foot .go{color:var(--ink-2); font-weight:600; white-space:nowrap;}
.rep-foot .go i{font-style:normal; display:inline-block; margin-left:4px; transition:transform .2s;}
.rep-card:hover .rep-foot .go i{transform:translateX(3px);}
@media (max-width:700px){ .rep-grid{grid-template-columns:1fr;} }
.rep-empty{padding:48px 32px; text-align:center; color:var(--muted);}
.rep-empty b{display:block; font-family:var(--serif); font-size:24px; color:var(--ink); margin-bottom:8px;}
.hub-main[data-view="quote"]  #pane-quote,
.hub-main[data-view="calc"]   #pane-calc,
.hub-main[data-view="weight"] #pane-weight,
.hub-main[data-view="edu"]    #pane-edu,
.hub-main[data-view="print"]  #pane-print{visibility:visible; pointer-events:auto;}
@media (min-width:1100px){
  .hub-main[data-view="edu"][data-split="1"]{grid-template-columns:1fr 460px; grid-template-areas:"main side";}
  .hub-main[data-view="edu"][data-split="1"] #pane-calc{visibility:visible; pointer-events:auto; grid-area:side;
    border-left:1px solid var(--line);}
}
@media (max-width:1099px){ #btn-split{display:none;} }

.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}
.sec-title{font-size:13px; letter-spacing:.14em; color:var(--faint); font-weight:600; margin:8px 12px 10px;}

/* ── 衛教圖卡：圖片盡量放大，病人坐在對面也看得清楚 ── */
#pane-edu{display:grid; grid-template-columns:260px 1fr; gap:18px; padding:18px; height:100%;}
.edu-rail{overflow:auto; padding:12px 10px;}
.edu-item{position:relative; display:flex; gap:10px; align-items:center; width:100%; text-align:left; border:0;
  background:transparent; padding:11px 12px; border-radius:10px; color:var(--ink-2); font-size:16.5px; line-height:1.4;}
.edu-item:hover{background:var(--sunken);}
/* 選取時不加粗：加粗會讓字變寬、換行位置跳動，改用底色與字色標示 */
.edu-item[aria-current="true"]{background:var(--acc-soft); color:var(--acc-text);}
.edu-item .ico{width:20px; flex:none; display:inline-flex; justify-content:center; color:var(--muted);}
.edu-item .lb{flex:1; min-width:0;}
.edu-item .pg{flex:none; font-size:12px; color:var(--faint); font-weight:400;}
/* 紙張大小標籤：每份衛教都註記 A4 或 A5，A5 用強調色 */
.sz{flex:none; display:inline-block; font-family:var(--sans, inherit); font-size:11.5px; font-weight:600; letter-spacing:.04em; line-height:1.3;
  padding:1px 6px; border-radius:6px; border:1px solid var(--line-strong); color:var(--muted); background:var(--surface); vertical-align:2px;}
.sz.a5{border-color:var(--acc); color:var(--acc-text); background:var(--acc-soft);}
.edu-head h1 .sz{margin-left:8px;}
/* 衛教分類：側欄最上方的分段切換 */
.edu-groups{display:flex; flex-direction:column; gap:4px; padding:2px 2px 12px; margin-bottom:8px; border-bottom:1px solid var(--line);}
.edu-group{display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--line); background:var(--surface);
  border-radius:10px; padding:9px 12px; font-size:15.5px; font-weight:600; color:var(--ink-2); text-align:left;}
.edu-group:hover{background:var(--sunken);}
.edu-group .n{font-size:12.5px; font-weight:400; color:var(--faint); background:var(--sunken); border-radius:999px; padding:1px 8px;}
.edu-group[aria-pressed="true"]{background:var(--acc); border-color:var(--acc); color:var(--acc-fg);}
.edu-group[aria-pressed="true"] .n{background:rgba(255,255,255,.18); color:#fff;}
.edu-item[aria-current="true"] .ico{color:var(--acc-text);}
/* 系列小標（療程、認識肥胖、用藥……），對應圖卡角落的編號 */
.edu-sec{font-size:12.5px; letter-spacing:.12em; color:var(--faint); font-weight:600; margin:12px 12px 4px;}
.edu-list > .edu-sec:first-child{margin-top:2px;}
/* 多份一起列印：勾選模式 */
.edu-item .ck{width:20px; height:20px; flex:none; display:inline-flex; align-items:center; justify-content:center;
  border:1.5px solid var(--line-strong); border-radius:6px; font-size:13px; color:var(--acc-fg); background:var(--surface);}
.edu-item.picking[aria-pressed="true"]{background:var(--acc-soft); color:var(--acc-text);}
.edu-item.picking[aria-pressed="true"] .ck{background:var(--acc); border-color:var(--acc);}
.edu-pick{position:sticky; bottom:-12px; background:var(--surface); border-top:1px solid var(--line); margin:10px -10px -12px; padding:10px;}
.edu-pick > .tbtn{width:100%;}
.edu-pick .sum{font-size:13.5px; color:var(--muted); margin:0 2px 8px;}
.edu-pick .acts{display:flex; gap:8px;}
.edu-pick .acts .tbtn{flex:1;}
.edu-pick .tbtn:disabled{opacity:.45; cursor:default;}
.edu-stage{display:grid; grid-template-rows:auto 1fr; min-height:0; min-width:0; overflow:hidden;}
.edu-tools{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.edu-tools h1{font-family:var(--serif); font-size:24px; font-weight:700; margin:0 0 0 4px; letter-spacing:.03em;}
#pane-edu{padding:12px; gap:12px;}
.edu-count{font-size:14px; color:var(--faint); margin-right:auto; font-variant-numeric:tabular-nums;}
.tbtn{border:1px solid var(--line-strong); background:var(--surface); border-radius:10px; padding:8px 15px; font-size:15px; color:var(--ink);}
.tbtn:hover{background:var(--sunken);}
.tbtn.pri{background:var(--acc-soft); border-color:var(--acc); color:var(--acc-text); font-weight:600;}
.tbtn.pri:hover{background:var(--acc); color:var(--acc-fg);}
/* 按鈕群組：上下張、縮放、檢視模式各成一組 */
.grp{display:inline-flex; align-items:stretch; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden; background:var(--surface);}
.grp > *{border:0; border-left:1px solid var(--line); background:transparent; padding:8px 13px; font-size:15px; min-width:42px;
  display:inline-flex; align-items:center; justify-content:center;}
.grp > *:first-child{border-left:0;}
.grp button:hover{background:var(--sunken);}
.grp button[aria-pressed="true"]{background:var(--acc); color:var(--acc-fg);}
.grp .nav{font-size:20px; line-height:1; padding:6px 14px;}
.zoom-val{min-width:96px; font-size:14.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; cursor:default;}
.edu-view{position:relative; overflow:auto; min-height:0; background:var(--sunken); display:flex; padding:16px;}
.edu-view img{margin:auto; flex:none; display:block; height:auto; background:#fff; border-radius:3px;
  box-shadow:0 2px 6px rgba(31,30,29,.08), 0 12px 32px rgba(31,30,29,.10);
  user-select:none; -webkit-user-drag:none;}
.edu-view.pannable{cursor:grab;}
.edu-view.panning{cursor:grabbing;}
.edu-view .msg{margin:auto; color:var(--muted);}
/* 全版面顯示：圖片使用整個高度，標題縮成左上角小標籤，工具列浮在右上角，蓋到圖片也沒關係 */
.edu-stage{grid-template-rows:1fr; position:relative;}
.edu-view{grid-row:1; padding:6px;}
.edu-tools{position:absolute; z-index:3; top:10px; left:10px; right:10px; padding:0; border:0; gap:10px;
  align-items:flex-start; justify-content:space-between; flex-wrap:nowrap; pointer-events:none;}
.edu-tools > *{pointer-events:auto;}
.edu-head, .edu-ctrl{background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 2px 10px rgba(31,30,29,.10);}
.edu-head{display:flex; align-items:baseline; gap:10px; padding:7px 14px; min-width:0;}
.edu-head h1{font-size:17px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.edu-pages{display:inline-flex; gap:4px;}
.edu-pages button{border:1px solid var(--line-strong); background:var(--surface); border-radius:8px; padding:3px 10px; font-size:13.5px; color:var(--ink-2);}
.edu-pages button[aria-pressed="true"]{background:var(--acc-soft); border-color:var(--acc); color:var(--acc-text); font-weight:600;}
.edu-head .edu-count{margin-right:0; font-size:13px; white-space:nowrap;}
.edu-ctrl{display:flex; align-items:center; gap:6px; padding:5px; flex-wrap:wrap; justify-content:flex-end;}
.edu-ctrl .grp > *{padding:6px 11px; font-size:14px; min-width:36px;}
.edu-ctrl .grp .nav{padding:4px 12px; font-size:18px;}
.edu-ctrl .zoom-val{min-width:84px; font-size:13.5px;}
.edu-ctrl .tbtn{padding:6px 12px; font-size:14px;}

/* 最大化：與減重系統相同，用頁面內最大化，不呼叫瀏覽器全螢幕（那會跳出無法關閉的系統提示）。
   要連瀏覽器網址列都隱藏，再按 F11。 */
body.edu-max .hub-bar, body.edu-max .hub-foot, body.edu-max .edu-rail{display:none;}
body.edu-max .hub-main{height:100dvh; grid-template-columns:1fr !important; grid-template-areas:"main" !important;}
body.edu-max #pane-calc{visibility:hidden !important;}
body.edu-max #pane-edu{grid-template-columns:1fr; padding:0; gap:0;}
body.edu-max .edu-stage{border:0; border-radius:0; box-shadow:none;}
body.edu-max .edu-view{background:#fff;}
body.edu-max .edu-view img{box-shadow:none;}

/* ── 列印表單：版面與衛教圖卡相同，左側清單、右側預覽；多頁表單並排顯示，按列印直接出 A4 ── */
#pane-print{display:grid; grid-template-columns:260px 1fr; gap:12px; padding:12px; height:100%;}
/* 預覽使用整個高度，工具列浮在上方，蓋到頁面也沒關係；頁面不夠放時改成上下排 */
.form-view{gap:12px; padding:6px; justify-content:safe center; align-items:safe center;}
.form-view.vertical{flex-direction:column;}
.form-view > img, .form-view > .fpage{margin:0; flex:none;}
.form-view .fpage{position:relative; overflow:hidden; background:#fff; border-radius:3px;
  box-shadow:0 2px 6px rgba(31,30,29,.08), 0 12px 32px rgba(31,30,29,.10);}
/* 固定 A4 大小再整體縮放；不可沿用 .pane iframe 的 100%，否則先縮小一次再縮放一次，只看得到左上角 */
.form-view .fpage iframe{position:absolute; left:0; top:0; width:794px; height:1123px; border:0; transform-origin:0 0; pointer-events:none; background:#fff;}
body.edu-max #pane-print{grid-template-columns:1fr; padding:0; gap:0;}
body.edu-max #pane-print .edu-view{background:var(--sunken);}
body.edu-max #pane-print .edu-view img{box-shadow:0 2px 6px rgba(31,30,29,.08), 0 12px 32px rgba(31,30,29,.10);}
.form-view .msg{text-align:center; line-height:1.8; max-width:420px;}
.form-view .msg b{display:block; font-size:18px; color:var(--ink); margin-bottom:4px;}

.hub-foot{height:var(--foot-h); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 22px;
  font-size:13px; color:var(--faint); background:var(--surface-alt); border-top:1px solid var(--line); white-space:nowrap; overflow:hidden;}
.app-revision{font:inherit; font-size:12.5px; color:var(--muted); opacity:.75; background:none; border:0; padding:4px 0; cursor:pointer;}
.app-revision:hover{opacity:1; text-decoration:underline;}
.modal-card ul.rev-list{margin:0; padding-left:1.3em; font-size:16px; color:var(--ink-2); line-height:1.7;}
.toast{position:fixed; left:50%; bottom:50px; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:12px 20px; border-radius:12px; font-size:15px; z-index:50; box-shadow:0 8px 28px rgba(0,0,0,.2);}

/* QR 放大：hidden 屬性要能蓋過 display:flex，所以只在沒有 hidden 時才設 flex */
.qr-overlay{position:fixed; inset:0; background:rgba(31,30,29,.55); z-index:60; align-items:center; justify-content:center;}
.qr-overlay:not([hidden]){display:flex;}
.qr-modal{background:#fff; border-radius:20px; padding:26px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.qr-modal img{width:min(70vw,380px); display:block;}
.qr-modal p{margin:14px 0 0; font-family:var(--serif); font-size:19px; font-weight:700;}

/* 清除確認視窗 */
.modal{position:fixed; inset:0; background:rgba(31,30,29,.45); z-index:70; align-items:center; justify-content:center; padding:16px;}
.modal:not([hidden]){display:flex;}
.modal-card{background:var(--surface); border-radius:18px; padding:26px 28px 22px; width:min(440px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.22);}
.modal-card h2{font-family:var(--serif); font-size:22px; margin:0 0 10px;}
.modal-card p{margin:0 0 8px; font-size:16px; color:var(--ink-2);}
.modal-card p.sub{font-size:14.5px; color:var(--muted);}
.modal-card p.warn{font-size:15px; color:#B0392B; font-weight:600;}
.modal-acts{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.modal-acts .tbtn{padding:10px 20px; font-size:16px;}
.tbtn.danger{background:var(--clay); border-color:var(--clay); color:#fff; font-weight:700;}
.tbtn.danger:hover{background:var(--clay-dark);}

@media (max-width:1320px){
  #pane-edu, #pane-print{grid-template-columns:210px 1fr; gap:14px; padding:14px;}
  .edu-tools h1{font-size:21px;}
  .grp > *{padding:7px 10px;}
  .zoom-val{min-width:84px;}
  .hub-tab kbd{display:none;}
  .hub-tab{padding:9px 15px;}
}
@media (max-width:1100px){
  .hub-brand{font-size:24px; letter-spacing:.06em;}
  .chip .k{display:none;}
}
/* ── 窄螢幕 ── */
@media (max-width:860px){
  :root{--bar-h:auto;}
  .hub-bar{flex-wrap:wrap; padding:10px 16px; gap:10px;}
  .hub-tabs{order:4; flex-basis:100%; overflow-x:auto;}
  .hub-tab{flex:1;}
  .hub-chips{order:5; flex-basis:100%; justify-content:flex-start;}
  .hub-main{height:calc(100dvh - 190px);}
  #pane-edu, #pane-print{grid-template-columns:1fr; grid-template-rows:auto 1fr; padding:10px; gap:10px;}
  .edu-rail{display:flex; flex-direction:column; overflow-x:auto; padding:6px;}
  .edu-groups{flex-direction:row; overflow-x:auto;}
  .edu-list{display:flex; overflow-x:auto;}
  .edu-rail .sec-title{display:none;}
  .edu-item{white-space:nowrap; width:auto;}
  .edu-item[aria-current="true"]::before{display:none;}
}
</style>
</head>

    <button class="hub-tab" role="tab" data-view="weight" aria-selected="false"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' class='ic ic-weight' aria-hidden='true' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><g fill='#4C74E0' stroke='none'><rect x='3.5' y='4' width='17' height='16.5' rx='2'/></g><g fill='#232A4D' fill-opacity='.18' stroke='none' clip-path='url(#mz-sh)'><rect x='3.5' y='4' width='17' height='16.5' rx='2'/></g><g fill='none'><rect x='3.5' y='4' width='17' height='16.5' rx='2'/></g><g fill='#FFFFFF' stroke='none'><path d='M8 11.5a4 4 0 0 1 8 0z'/></g><g fill='#232A4D' fill-opacity='.18' stroke='none' clip-path='url(#mz-sh)'><path d='M8 11.5a4 4 0 0 1 8 0z'/></g><g fill='none'><path d='M8 11.5a4 4 0 0 1 8 0z'/></g><g fill='none'><path class='a-swing' d='M12 11.5l1.75-2.25'/><path stroke='#FFFFFF' d='M8 16.5h2.5M13.5 16.5H16'/></g></svg>製作報告<kbd>Alt+4</kbd></button>

    <button class="chip" id="chip-weight" data-go="weight" hidden></button>

</header>

            <span class="rep-txt"><b>減重報告</b><small>基本資料、病史、身體組成、檢驗、生活型態到治療計畫，填完產生 PDF 報告。</small></span>
            <span class="rep-foot"><span class="meta" data-rep-meta="obesity_records_v1"></span><span class="go">開始製作<i>→</i></span></span>

<script src="forms/forms.js"></script>
<script>

/* 報價、減重報告與臨床計算都直接放在工作台裡，不再用 iframe：
   各自的畫面檔（quote/view.html、weight/view.html、calc/view.html）由 mount.js 裝進 #quote-host、#weight-host、#calc-host 的 shadow root，
   樣式與 id 關在裡面，和工作台互不影響。程式以 QD／QB（報價）、WD／WB（減重）、CD／CB（臨床計算）操作自己的畫面與捲動區。
   舊網址 tools/weight/、tools/quote/、clinic-planner 轉到這裡；tools/calc/ 是病人版，與工作台共用同一份畫面與程式。
   以 file:// 開啟時改讀線上版，只剩分頁切換與保留結果。 */
const IS_FILE = location.protocol === 'file:';
const BASE = IS_FILE ? 'https://adigu2025.github.io/tools/' : './';
// 清除時只刪「目前填寫中」的暫存，兩份報告已儲存的紀錄（obesity_records_v1、checkup_records_v1）不動。
const CLEAR_KEYS = {
  quote:  [['local','muzicheng_planner_state_v1']],
  calc:   [['session','muzi-calc-state']],
  weight: [['local','obesity_draft_v1']],
  checkup: [['local','checkup_draft_v1']]
};

const main = document.getElementById('hub-main');

/* 報價。QD、QB 是報價程式共用的全域變數；工作台外觀 quote/hub.css 只在這裡加上 */
let QD = null, QB = null;
async function mountQuote(){
  const host = document.getElementById('quote-host');
  try{
    await mountView(host, BASE + 'quote/view.html', {
      css: [BASE + 'quote/hub.css'],
      onRoot: root=>{ QD = root; QB = root.getElementById('q-body'); },
      scripts: [BASE + 'quote/app.js']
    });
  }catch(err){ mountFailed(host, '報價系統', err); return; }
  host.classList.remove('loading');
  if(main.dataset.view === 'quote') QB.focus({preventScroll:true});
}
// 報價單的列印：只印報價這一區（見樣式 body.print-quote）。
// @page 寫在 shadow root 裡不一定有作用，列印時在工作台另外放一份：A4、邊界 0，瀏覽器不會加上網址與日期的頁首頁尾
window.QUOTE_PRINT = ()=>{
  const page = document.createElement('style');
  page.textContent = '@page{size:A4;margin:0;}';
  document.head.appendChild(page);
  document.body.classList.add('print-quote');
  window.print();
  document.body.classList.remove('print-quote');
  page.remove();
};

/* 減重與健檢報告共用的判讀（lab/lab.js）與排版、判讀標準（kit/report-kit.js）。只載入一次，兩份報告都等它好了再裝 */
const sharedReady = loadScripts([BASE + 'lab/lab.js', BASE + 'kit/report-kit.js']);

/* 減重報告。WD、WB 是減重程式共用的全域變數 */
let WD = null, WB = null, weightReady = false;
async function mountWeight(){
  const host = document.getElementById('weight-host');
  try{
    await sharedReady;
    await mountView(host, BASE + 'weight/view.html', {
      onRoot: root=>{ WD = root; WB = root.getElementById('w-body'); },
      scripts: [BASE + 'weight/app.js', BASE + 'weight/report.js']
    });
  }catch(err){ mountFailed(host, '減重報告', err); return; }
  weightReady = true;
  const upd = ()=> setTimeout(updateChips, 30);
  ['input','change','click'].forEach(t=> WD.addEventListener(t, upd, true));
  updateChips();
  host.classList.remove('loading');
  syncRep();
}

/* 健檢報告。KD、KB 是健檢程式共用的全域變數。
   報告排版與判讀標準在共用的 kit/report-kit.js，不依賴減重報告，減重載入失敗也不受影響 */
let KD = null, KB = null;
async function mountCheckup(){
  const host = document.getElementById('checkup-host');
  try{
    await sharedReady;
    await mountView(host, BASE + 'checkup/view.html', {
      onRoot: root=>{ KD = root; KB = root.getElementById('k-body'); },
      scripts: [BASE + 'checkup/app.js', BASE + 'checkup/report.js']
    });
  }catch(err){ mountFailed(host, '健檢報告', err); return; }
  host.classList.remove('loading');
  syncRep();
}

/* 臨床計算。CD、CB 是計算程式共用的全域變數；工作台外觀 calc/hub.css 只在這裡加上 */
let CD = null, CB = null, calcReady = false;
async function mountCalc(){
  const host = document.getElementById('calc-host');
  try{
    await mountView(host, BASE + 'calc/view.html', {
      css: [BASE + 'calc/hub.css'],
      onRoot: root=>{ CD = root; CB = root.getElementById('c-body'); },
      scripts: [BASE + 'calc/rules.js', BASE + 'calc/app.js']
    });
  }catch(err){ mountFailed(host, '臨床計算', err); return; }
  calcReady = true;
  const upd = ()=> setTimeout(updateChips, 30);
  ['input','change','click'].forEach(t=> CD.addEventListener(t, upd, true));
  splitCalcPanels();
  // 倍率只在載入與視窗大小改變時計算一次，所有工具共用，切換時字級不跳動
  calcZ = null;
  fitCalc();
  setTimeout(()=>{ calcZ = null; fitCalc(); }, 400);
  // 切換到降血脂或 B 肝用藥時，結果欄才看得到；等面板淡入動畫（0.28 秒，會位移）結束再量
  CD.addEventListener('click', e=>{ if(e.target.closest('.tab, .group-btn')) setTimeout(fitRxOut, 320); }, true);
  // 輸入過程不再改變倍率：少數狀態（例如欄位錯誤提示）超出畫面時，寧可短暫出現捲軸，也不讓全部字級跳動
  updateChips();
  host.classList.remove('loading');
  if(main.dataset.view === 'calc') CB.focus({preventScroll:true});
}
function mountFailed(host, name, err){
  console.error(err);
  host.classList.remove('loading');
  host.innerHTML = `<div class="msg" style="padding:40px;text-align:center">${name}載入失敗，請重新整理頁面。</div>`;
}
// 臨床計算「已完成的評估」的列印：只印臨床計算這一區（見樣式 body.print-calc）
window.CALC_PRINT = ()=>{
  document.body.classList.add('print-calc');
  const done = ()=>{ document.body.classList.remove('print-calc'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(done, 1000);
};
/* ── 分頁切換 ── */
// 分頁還沒打開時先把圖片網址放在 data-src，不佔開頁的頻寬；setView 打開分頁時才換成 src
function imgSrcAttr(view, src){ return (main.dataset.view === view ? 'src' : 'data-src') + `="${src}"`; }
function setView(v){
  // 最大化只用在衛教與列印表單，切到其他分頁時先結束，否則上方分頁列會一直隱藏
  if(document.body.classList.contains('edu-max') && v !== 'edu' && v !== 'print') toggleMax();
  if(document.body.classList.contains('q-max') && v !== 'quote' && window.Q_EXIT_MAX) Q_EXIT_MAX();
  main.dataset.view = v;
  document.querySelectorAll('.hub-tab').forEach(b=> b.setAttribute('aria-selected', String(b.dataset.view === v)));
  document.getElementById('btn-split').hidden = (v !== 'edu');
  document.body.dataset.view = v;
  // 衛教與表單的圖片在分頁第一次打開時才下載
  document.querySelectorAll('#pane-' + v + ' img[data-src]').forEach(im=>{ im.src = im.dataset.src; im.removeAttribute('data-src'); });
  syncRep();
  if(v === 'edu'){
    document.getElementById('edu-view').focus({preventScroll:true});
    setTimeout(applyZoom, 0);
  }
  if(v === 'print'){
    document.getElementById('form-view').focus({preventScroll:true});
    setTimeout(applyFormZoom, 0);
  }
  // 頁面重新整理後回到同一個分頁
  store('hub-view', v);
  // 報價的 Ctrl+K、Esc、方向鍵也一樣，焦點要在報價畫面內
  if(v === 'quote' && QB) QB.focus({preventScroll:true});
  // 臨床計算的 ESC、貼上截圖等操作要在焦點位於計算畫面內時才有作用
  if(v === 'calc' && CB) CB.focus({preventScroll:true});
}
const FOOT_HINT = {
  quote:  'Ctrl+K 搜尋　Esc 返回選單　右鍵切換自費／免自費',
  calc:   '以上結果僅供臨床參考，實際診斷與治療須由醫師綜合判斷。數值只在本機計算，不會上傳。',
  report: '選擇要製作的報告。',
  weight: '減重報告會自動暫存草稿；上傳的檔案只在這台電腦讀取，不會上傳。按 Esc 回到報告種類。',
  checkup: '健檢報告會自動暫存草稿（不含 PDF 圖片）；上傳的檔案只在這台電腦讀取，不會上傳。按 Esc 回到報告種類。',
  edu:    '← → 換張　＋ － 縮放　0 整頁　W 寬度　F 最大化　放大後可按住圖片拖曳',
  print:  '按「列印」會直接跳出列印對話框，紙張為 A4。'
};
// 個人瀏覽器的小設定（上次的分頁、衛教圖卡與縮放），讀不到就用預設值
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(err){} }
function recall(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; }catch(err){ return d; } }
document.querySelectorAll('.hub-tab').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.view)));
document.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.go)));

/* ── 製作報告：home＝選報告種類，weight＝減重報告，checkup＝體檢報告 ── */
function setRep(r){
  main.dataset.rep = r;
  store('hub-rep', r);
  syncRep();
}
function syncRep(){
  const v = main.dataset.view, r = main.dataset.rep;
  if(v === 'weight' && r === 'home') renderRepMeta();
  document.getElementById('btn-rep-back').hidden = !(v === 'weight' && r !== 'home');
  const hint = v === 'weight' ? (r === 'home' ? 'report' : r) : v;
  document.getElementById('foot-hint').textContent = FOOT_HINT[hint] || FOOT_HINT.calc;
  // 減重報告的方向鍵與 ESC 快捷鍵要在焦點位於報告畫面內時才有作用
  if(v === 'weight' && r === 'weight' && WB) WB.focus({preventScroll:true});
  if(v === 'weight' && r === 'checkup' && KB) KB.focus({preventScroll:true});
}
// 報告種類卡片底部：這台電腦已儲存幾筆病人紀錄（讀不到就不顯示）
function renderRepMeta(){
  document.querySelectorAll('[data-rep-meta]').forEach(el=>{
    let n = null;
    try{ const r = JSON.parse(localStorage.getItem(el.dataset.repMeta)); n = Array.isArray(r) ? r.length : 0; }catch(err){}
    el.textContent = n == null ? '' : n ? '已儲存 ' + n + ' 筆紀錄' : '尚無儲存紀錄';
  });
}
// 只綁報告種類的按鈕。<main> 本身也有 data-rep（記錄目前在哪個報告），綁到它的話報告裡任何一次點擊
// 都會觸發 setRep → syncRep → 把焦點搶回報告容器，輸入欄位一放開滑鼠就失去游標
document.querySelectorAll('button[data-rep]').forEach(b=> b.addEventListener('click', ()=> setRep(b.dataset.rep)));
document.getElementById('btn-rep-back').addEventListener('click', ()=> setRep('home'));
// 頂端的減重摘要直接帶到減重報告
document.getElementById('chip-weight').addEventListener('click', ()=> setRep('weight'));
document.getElementById('btn-split').addEventListener('click', e=>{
  const on = main.dataset.split !== '1';
  main.dataset.split = on ? '1' : '0';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  // 圖卡區與計算區的寬度都變了：重新算圖卡的「整頁／寬度」大小與計算區倍率
  setTimeout(()=>{ applyZoom(); if(calcReady) fitCalc(); }, 0);
});

// 焦點是否在輸入欄位裡。臨床計算等工具放在 shadow root，文件層收到的 e.target 只是外框（#calc-host），
// 要用 composedPath() 的第一個元素才是真正按鍵的欄位
function typingInField(e){
  const t = e.composedPath()[0];
  return !!(t && t.closest && (t.closest('input,textarea,select') || t.isContentEditable));
}
function onHubKey(e){
  if(e.altKey && !e.ctrlKey && !e.metaKey){
    const v = {'1':'quote','2':'calc','3':'edu','4':'weight','5':'print'}[e.key];
    if(v){ e.preventDefault(); setView(v); return true; }
  }
  return false;
}
document.addEventListener('keydown', e=>{
  if(onHubKey(e)) return;
  if(!clearModal.hidden){
    if(e.key === 'Escape'){ e.preventDefault(); closeClear(); }
    return;
  }
  if(!revModal.hidden){
    if(e.key === 'Escape'){ e.preventDefault(); closeRev(); }
    return;
  }
  if(e.key === 'Escape' && !qrOverlay.hidden){ qrOverlay.hidden = true; return; }
  if(main.dataset.view === 'print' && !e.ctrlKey && !e.metaKey && !e.altKey){
    if(typingInField(e)) return;
    const k = e.key, canScroll = formView.classList.contains('pannable');
    if(k === 'ArrowLeft' || (k === 'ArrowUp' && !canScroll)){ e.preventDefault(); stepForm(-1); }
    else if(k === 'ArrowRight' || (k === 'ArrowDown' && !canScroll)){ e.preventDefault(); stepForm(1); }
    else if(k === '+' || k === '='){ e.preventDefault(); formZoomStep(1); }
    else if(k === '-' || k === '_'){ e.preventDefault(); formZoomStep(-1); }
    else if(k === '0'){ e.preventDefault(); formZoom = 'fit'; applyFormZoom(); }
    else if(k === 'f' || k === 'F'){ e.preventDefault(); toggleMax(); }
    else if(k === 'Escape' && document.body.classList.contains('edu-max')){ e.preventDefault(); toggleMax(); }
    return;
  }
  if(main.dataset.view !== 'edu' || e.ctrlKey || e.metaKey || e.altKey) return;
  // 並排計算時，焦點在右側臨床計算裡的按鍵都留給計算（打數字、方向鍵選項），不當成換張或縮放
  if(typingInField(e) || e.composedPath().includes(document.getElementById('calc-host'))) return;
  // 圖片放大後可捲動時，上下鍵留給捲動，換張只用左右鍵
  const canScroll = eduView.classList.contains('pannable');
  const k = e.key;
  if(k === 'ArrowLeft' || (k === 'ArrowUp' && !canScroll)){ e.preventDefault(); stepEdu(-1); }
  else if(k === 'ArrowRight' || (k === 'ArrowDown' && !canScroll)){ e.preventDefault(); stepEdu(1); }
  else if(k === '+' || k === '='){ e.preventDefault(); zoomStep(1); }
  else if(k === '-' || k === '_'){ e.preventDefault(); zoomStep(-1); }
  else if(k === '0'){ e.preventDefault(); setZoom('fit'); }
  else if(k === 'w' || k === 'W'){ e.preventDefault(); setZoom('width'); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); toggleMax(); }
  else if(k === 'Escape' && document.body.classList.contains('edu-max')){ e.preventDefault(); toggleMax(); }
});

/* 臨床計算自動縮放：所有工具共用同一個倍率，切換工具或分類時字級不會跳動。
   倍率取「每個工具都放得進畫面」的最大值：逐一量過每個工具（結果區全部展開的最壞情況），取最小者。
   量測在同一段同步程式內完成，畫面不會閃。
   降血脂與 B 肝用藥兩個判定表單不列入計算（避免拉低所有工具的字級），輸入區已排成一屏，結果欄在欄內捲動（fitRxOut）。 */
const CALC_SCROLL_OK = new Set(['panel-lipidrx', 'panel-hbvrx']);
const CALC_MIN_Z = 0.8, CALC_MAX_Z = 1.45;
let calcZ = null;

// root 是臨床計算的捲動區（.c-body）：內容高度不超過它的高度，就表示不必捲動
function calcCtx(){
  if(!calcReady) return null;
  const card = CD.querySelector('.card');
  if(!card || !CB.clientHeight || !CB.clientWidth) return null;
  return {d: CD, card, root: CB, H: CB.clientHeight, W: CB.clientWidth};
}

// 在目前顯示狀態下，找出不出現捲軸的最大倍率（上限 hi）
function maxFit(c, hi){
  const fits = z=>{ c.card.style.zoom = z; return c.root.scrollHeight <= c.H; };
  if(fits(hi)) return hi;
  if(!fits(CALC_MIN_Z)) return CALC_MIN_Z;
  // 放大時版面變窄、換行變多，高度不是線性變化，用二分搜尋
  let lo = CALC_MIN_Z;
  for(let i = 0; i < 7; i++){
    const mid = (lo + hi) / 2;
    if(fits(mid)) lo = mid; else hi = mid;
  }
  return lo;
}

function computeCalcZ(c){
  const {d} = c;
  const panels = [...d.querySelectorAll('.tool-panel')];
  const saved = panels.map(p=> [p, p.hidden, p.classList.contains('active')]);
  const notice = d.getElementById('staff-notice'), summary = d.getElementById('summary-zone');
  const noticeHidden = notice ? notice.hidden : true, summaryHidden = summary ? summary.hidden : true;
  // 各分類的工具分頁列寬度不同，量測時換成該分類實際會出現的那一列
  const tabRows = [...d.querySelectorAll('.tabs[data-group]')];
  const tabRowsHidden = tabRows.map(r=> r.hidden);
  const calcBtn = d.getElementById('group-calc');
  const calcBtnHidden = calcBtn ? calcBtn.hidden : true;
  if(calcBtn) calcBtn.hidden = false;
  let z = Math.min(CALC_MAX_Z, Math.max(1, c.W / 1250));

  panels.filter(p=> !CALC_SCROLL_OK.has(p.id)).forEach(p=>{
    panels.forEach(x=>{ x.hidden = true; x.classList.remove('active'); });
    p.hidden = false; p.classList.add('active');
    // 依工具所屬分類還原提示列；「已完成的評估」欄依面板的 data-summary（自我評估才有）
    const tab = d.getElementById('tab-' + p.id.replace('panel-', ''));
    const group = tab && tab.closest('.tabs') ? tab.closest('.tabs').dataset.group : '';
    tabRows.forEach(r=> r.hidden = r.dataset.group !== group);
    if(notice) notice.hidden = group !== 'calc';
    if(summary) summary.hidden = !p.dataset.summary;
    // 結果區有的用行內 display:none、有的用 hidden 或 class 隱藏，一律以實際顯示狀態判斷，量完原樣還原
    const forced = [...p.querySelectorAll('.hub-out [id$="-result"]')]
      .filter(e=> getComputedStyle(e).display === 'none')
      .map(e=> ({e, v: e.style.getPropertyValue('display'), pr: e.style.getPropertyPriority('display'), h: e.hidden}));
    const hints  = [...p.querySelectorAll('.hub-out [id$="-hint"]')].filter(e=> e.style.display !== 'none');
    // 逐步放寬：先一般的 block（讓 BMI、TDEE 那幾條 !important 的排版規則照常生效），還是隱藏才加 !important
    forced.forEach(({e})=>{
      e.hidden = false;
      e.style.setProperty('display', 'block');
      if(getComputedStyle(e).display === 'none') e.style.setProperty('display', 'block', 'important');
    });
    hints.forEach(e=> e.style.display = 'none');
    z = Math.min(z, maxFit(c, z));
    forced.forEach(({e, v, pr, h})=>{
      if(v) e.style.setProperty('display', v, pr); else e.style.removeProperty('display');
      e.hidden = h;
    });
    hints.forEach(e=> e.style.display = '');
  });

  saved.forEach(([p, h, a])=>{ p.hidden = h; p.classList.toggle('active', a); });
  if(notice) notice.hidden = noticeHidden;
  if(summary) summary.hidden = summaryHidden;
  tabRows.forEach((r, i)=> r.hidden = tabRowsHidden[i]);
  if(calcBtn) calcBtn.hidden = calcBtnHidden;
  return z;
}

function fitCalc(){
  const c = calcCtx();
  if(!c) return;
  // 窄畫面（含並排模式）維持單欄原尺寸，允許捲動
  if(c.W < 1100){ c.card.style.zoom = 1; fitRxOut(); return; }
  if(calcZ === null) calcZ = computeCalcZ(c);
  c.card.style.zoom = calcZ;
  fitRxOut();
}

// 降血脂與 B 肝用藥：結果卡片很長，結果欄高度限制在畫面內、欄內捲動，左側輸入不必跟著捲
function fitRxOut(){
  const c = calcCtx();
  if(!c) return;
  const z = parseFloat(c.card.style.zoom) || 1;
  c.d.querySelectorAll('.rx-panel .hub-out').forEach(o=>{
    o.style.maxHeight = '';
    if(c.W < 1100 || !o.offsetParent) return;
    // 位置是螢幕像素，max-height 會再乘上倍率，所以要除回去
    const top = o.getBoundingClientRect().top - c.root.getBoundingClientRect().top + c.root.scrollTop;
    let h = (c.H - top) / z;
    o.style.maxHeight = h + 'px';
    // 再扣掉卡片與頁面下緣的留白，直到整頁不出現捲軸
    const over = c.root.scrollHeight - c.H;
    if(over > 0) h = (o.getBoundingClientRect().height - over) / z - 1;
    o.style.maxHeight = Math.max(300, h) + 'px';
  });
}

// 面板尺寸一變（視窗縮放、切換並排、手機轉向）就重算共用倍率；
// 不只依賴視窗的 resize 事件，切換並排等情況下它不會觸發
{
  let t = null;
  const refit = ()=>{ clearTimeout(t); t = setTimeout(()=>{ calcZ = null; fitCalc(); }, 120); };
  new ResizeObserver(refit).observe(document.getElementById('pane-calc'));
  window.addEventListener('resize', refit);
}

/* 臨床計算的寬螢幕版面：每個工具分成左「輸入」、右「結果」兩欄，算完不必往下捲。
   只搬動既有元素的位置（id 與事件都不變），量表類工具題目多、結果在最後才出現，維持單欄。
   窄螢幕或並排模式時，CSS 會讓兩欄自動疊回單欄。 */
function splitCalcPanels(){
  const doc = CD;
  // 附註放左欄、結果與對照表放右欄，兩欄高度較平均
  const isOut = c=> /-(result|hint)$/.test(c.id) || c.matches('.ref-table, .rx-cards, .rx-basis');
  doc.querySelectorAll('.tool-panel').forEach(p=>{
    if(p.classList.contains('hub-split') || p.querySelector(':scope > .quiz-intro')) return;
    const kids = [...p.children].filter(c=> !c.classList.contains('panel-head'));
    if(!kids.some(isOut)) return;
    const L = document.createElement('div'); L.className = 'hub-in';
    const R = document.createElement('div'); R.className = 'hub-out';
    kids.forEach(c=> (isOut(c) ? R : L).appendChild(c));
    p.append(L, R);
    p.classList.add('hub-split');
  });
  // 結果欄捲動時停在分頁列下方
  const tw = doc.querySelector('.tabs-wrap');
  const setTop = ()=> CB.style.setProperty('--hub-sticky', ((tw ? tw.offsetHeight : 0) + 14) + 'px');
  setTop();
  window.addEventListener('resize', setTop);
}
// 左下角只顯示五個工具裡最晚的改版日期；點一下跳出 revision.js 的 REVISION_NOTE
const LATEST_REV = Object.values(REVISION).sort().pop();
const revModal = document.getElementById('rev-modal');
function renderRevision(){
  document.getElementById('app-revision').textContent = '最後改版：' + LATEST_REV;
}
function closeRev(){ revModal.hidden = true; document.getElementById('app-revision').focus(); }
document.getElementById('app-revision').addEventListener('click', ()=>{
  document.getElementById('rv-title').textContent = LATEST_REV + ' 改了什麼';
  document.getElementById('rv-list').innerHTML = REVISION_NOTE.map(t=> '<li>' + esc(t) + '</li>').join('');
  revModal.hidden = false;
  document.getElementById('rv-close').focus();
});
document.getElementById('rv-close').addEventListener('click', closeRev);
revModal.addEventListener('click', e=>{ if(e.target === revModal) closeRev(); });

function txt(doc, id){ const el = doc && doc.getElementById(id); return el ? el.textContent.trim() : ''; }
function updateChips(){
  const cc = document.getElementById('chip-calc');
  const cw = document.getElementById('chip-weight');
  try{
    const d = CD;
    const box = d && d.getElementById('bmi-result');
    const v = txt(d,'bmi-val');
    if(box && box.style.display !== 'none' && v && v !== '—'){
      cc.innerHTML = '<span class="k">臨床計算</span>BMI <b>' + esc(v) + '</b>　' + esc(txt(d,'bmi-badge'));
      cc.hidden = false;
    }else cc.hidden = true;
  }catch(err){ cc.hidden = true; }
  try{
    const d = WD;
    const name = d && d.getElementById('p-name') ? d.getElementById('p-name').value.trim() : '';
    const bmi = txt(d,'bmi-value');
    const parts = [];
    if(name) parts.push(maskName(name));
    if(bmi && bmi !== '--' && bmi !== '—') parts.push('BMI <b>' + esc(bmi) + '</b>');
    if(parts.length){
      // 減重系統原本的「尚未儲存／已儲存」狀態在被隱藏的頁首裡，改顯示在這裡
      const st = txt(d,'status-pill');
      const saved = /^已儲存|^已載入/.test(st);
      cw.innerHTML = '<span class="k">減重報告</span>' + parts.join('　') +
        (st ? `<span class="save ${saved ? 'ok' : ''}">${saved ? '已儲存' : '未儲存'}</span>` : '');
      cw.hidden = false;
    }else cw.hidden = true;
  }catch(err){ cw.hidden = true; }
}
// 頂端列病人看得到，姓名只露第一個字
// 姓名中間遮成○，頭尾留著（王○明、兩個字是王○），與健檢 LINE 摘要圖的 ckMaskName 相同；正式報告印全名
function maskName(n){ const s = [...String(n)]; return esc(s.length <= 1 ? s.join('') : s.length === 2 ? s[0] + '○' : s[0] + '○'.repeat(s.length - 2) + s[s.length - 1]); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── 全部清除 ── */
const clearModal = document.getElementById('clear-modal');
function openClear(){
  // 健檢報告有上傳圖片、還沒匯出備份時多一行提醒（圖片只在記憶體裡，清除後就沒了）
  let pages = false;
  try{ pages = ckPagesUnsaved && Object.keys(CK_PAGES).length > 0; }catch(err){}
  document.getElementById('cm-pages').hidden = !pages;
  clearModal.hidden = false;
  // 預設焦點放在「取消」，避免誤按 Enter 就清掉
  document.getElementById('cm-cancel').focus();
}
function closeClear(){ clearModal.hidden = true; document.getElementById('btn-clear').focus(); }
document.getElementById('btn-clear').addEventListener('click', openClear);
document.getElementById('cm-cancel').addEventListener('click', closeClear);
clearModal.addEventListener('click', e=>{ if(e.target === clearModal) closeClear(); });
document.getElementById('cm-ok').addEventListener('click', ()=>{
  clearModal.hidden = true;
  // 減重報告直接放在工作台裡，最乾淨的清除方式是刪掉暫存後重新載入整頁（臨床計算也一併重來）。
  // 先停掉減重的自動暫存計時器並標記為未修改，才不會在重新載入前又寫回草稿、或跳出「離開網頁」提醒。
  if(weightReady){ try{ clearTimeout(draftTimer); isDirty = false; }catch(err){} }
  try{ clearTimeout(ckSaveTimer); }catch(err){}
  window.HUB_RELOADING = true;
  Object.values(CLEAR_KEYS).flat().forEach(([kind, k])=>{
    try{ (kind === 'session' ? sessionStorage : localStorage).removeItem(k); }catch(err){}
  });
  try{ sessionStorage.setItem('hub-cleared', '1'); }catch(err){}
  location.reload();
});

/* ── 離線快取（sw.js）：診所斷網時工作台仍可開啟。本機 file:// 開啟時不使用 ── */

  navigator.serviceWorker.register('sw.js').then(()=> navigator.serviceWorker.ready).then(reg=>{
    // 開啟 8 秒後（不搶開頁的頻寬），在背景預存所有衛教與表單圖片，斷網時也能顯示與列印

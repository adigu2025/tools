<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木子澄安診所</title>
<style>
/* ── 設計規範：Apple Human Interface Guidelines 的版面、間距（8pt 格線）、圓角、字級與 44pt 觸控尺寸，
   顏色改用診所品牌：主色 Teal、強調 Gold、文字 Navy。背景一律實色，不用毛玻璃。
   深色模式不提供：嵌入的兩個工具只有淺色版，外殼單獨變深色反而割裂。 ── */
:root{
  --tint:#3E6A7C; --tint-pressed:#2E5262; --tint-fill:rgba(62,106,124,.12); --tint-fill-2:rgba(62,106,124,.2);
  --accent:#BC7F30; --accent-fill:rgba(188,127,48,.14);
  --label:#152831; --label-2:rgba(21,40,49,.64); --label-3:rgba(21,40,49,.42);
  --bg-grouped:#F2F2F7; --bg-elev:#FFFFFF; --bg-sunken:#E9EDF0;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --separator:rgba(60,60,67,.18); --separator-opaque:#D8D8DE;
  --destructive:#D70015; --destructive-fill:rgba(255,59,48,.12);
  --success:#248A3D; --success-fill:rgba(52,199,89,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1); --ease-out:cubic-bezier(0,0,.58,1);
  --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --ring:0 0 0 4px rgba(62,106,124,.3);
  --bar-h:72px; --foot-h:32px;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:var(--bg-grouped); color:var(--label); font-family:var(--font);
  font-size:17px; line-height:1.47; -webkit-font-smoothing:antialiased; letter-spacing:.01em;}
button{font:inherit; cursor:pointer; color:inherit; -webkit-tap-highlight-color:transparent;}
:focus{outline:none;}
:focus-visible{box-shadow:var(--ring); border-radius:10px;}
svg.sym{width:1.1em; height:1.1em; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

/* 按壓回饋：所有可點按的控制項 */
.press{transition:transform 100ms var(--ease-out), background-color 200ms var(--ease), color 200ms var(--ease);}
.press:active{transform:scale(.97);}

/* ── 頂端工具列：前段（品牌）｜中段（切換）｜後段（動作） ── */
.hub-bar{height:var(--bar-h); display:flex; align-items:center; gap:16px; padding:0 24px;
  background:var(--bg-elev); border-bottom:.5px solid var(--separator-opaque);}
.qr-btn{width:44px; height:44px; padding:3px; border:0; border-radius:10px; background:#fff; flex:none;
  box-shadow:0 0 0 .5px var(--separator-opaque);}
.qr-btn img{width:100%; height:100%; display:block; border-radius:7px;}
.hub-brand{white-space:nowrap; font-size:28px; font-weight:700; letter-spacing:.06em; line-height:1; margin-right:8px;}

/* 分段控制：軌道 2px 內距，內外圓角同心（8＋2＝10） */
.hub-tabs{display:flex; background:var(--fill); padding:2px; border-radius:10px; gap:0;}
.hub-tab{position:relative; border:0; background:transparent; color:var(--label); min-height:40px; padding:0 20px;
  border-radius:8px; font-size:16px; font-weight:500; white-space:nowrap;}
.hub-tab + .hub-tab::before{content:""; position:absolute; left:0; top:10px; bottom:10px; width:1px; background:var(--separator);}
.hub-tab[aria-selected="true"]::before, .hub-tab[aria-selected="true"] + .hub-tab::before{opacity:0;}
.hub-tab[aria-selected="true"]{background:var(--bg-elev); font-weight:600;
  box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);}
.hub-tab kbd{font:inherit; font-size:12px; color:var(--label-3); margin-left:6px; font-weight:400;}

.hub-chips{display:flex; gap:8px; flex:1; min-width:0; overflow:hidden; justify-content:flex-end;}
.chip{display:inline-flex; align-items:center; gap:6px; border:0; background:var(--fill); border-radius:999px;
  min-height:36px; padding:0 14px; font-size:15px; white-space:nowrap; color:var(--label);}
.chip:hover{background:var(--fill-2);}
.chip .k{color:var(--label-2); font-size:13px;}
.chip b{font-size:17px; font-weight:700; color:var(--tint);}
.chip[hidden]{display:none;}
.chip .save{font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--accent-fill); color:#8A5A1C;}
.chip .save.ok{background:var(--success-fill); color:var(--success);}

.hub-actions{display:flex; gap:8px;}
/* 膠囊按鈕：次要為淡色底＋主色字，主要為主色底＋白字 */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 18px;
  border:0; border-radius:999px; background:var(--tint-fill); color:var(--tint); font-size:16px; font-weight:600; white-space:nowrap;}
.btn:hover{background:var(--tint-fill-2);}
.btn[aria-pressed="true"]{background:var(--tint); color:#fff;}
.btn.clear{background:var(--destructive-fill); color:var(--destructive);}
.btn.clear:hover{background:rgba(255,59,48,.2);}
.btn[hidden]{display:none;}

/* ── 主區：四個面板疊在同一格，只切換可見度。
   用 visibility 而非 display:none，隱藏中的工具仍保有版面，背景列印與匯出 PDF 才不會出錯。 ── */
.hub-main{position:relative; height:calc(100dvh - var(--bar-h) - var(--foot-h)); display:grid;
  grid-template-columns:1fr; grid-template-areas:"main";}
.pane{grid-area:main; min-height:0; min-width:0; visibility:hidden; pointer-events:none;}
.pane iframe{width:100%; height:100%; border:0; display:block; background:var(--bg-grouped);}
.hub-main[data-view="calc"]   #pane-calc,
.hub-main[data-view="weight"] #pane-weight,
.hub-main[data-view="edu"]    #pane-edu,
.hub-main[data-view="print"]  #pane-print{visibility:visible; pointer-events:auto;}
@media (min-width:1100px){
  .hub-main[data-view="edu"][data-split="1"]{grid-template-columns:1fr 460px; grid-template-areas:"main side";}
  .hub-main[data-view="edu"][data-split="1"] #pane-calc{visibility:visible; pointer-events:auto; grid-area:side;
    border-left:.5px solid var(--separator-opaque);}
}
@media (max-width:1099px){ #btn-split{display:none;} }

.card{background:var(--bg-elev); border-radius:16px; box-shadow:var(--shadow-card);}
.sec-title{font-size:13px; font-weight:400; color:var(--label-2); text-transform:none; margin:6px 16px 6px;}

/* ── 衛教圖卡 ── */
#pane-edu{display:grid; grid-template-columns:272px 1fr; gap:16px; padding:16px; height:100%;}
/* 側欄：分組清單，列高至少 44pt，分隔線從文字起點開始 */
.edu-rail{overflow:auto; padding:8px;}
.edu-item{position:relative; display:flex; gap:12px; align-items:center; width:100%; min-height:44px; text-align:left; border:0;
  background:transparent; padding:10px 12px; border-radius:10px; color:var(--label); font-size:16px; line-height:1.35;}
.edu-item:hover{background:var(--fill);}
.edu-item + .edu-item::after{content:""; position:absolute; left:44px; right:12px; top:0; height:.5px; background:var(--separator);}
.edu-item[aria-current="true"], .edu-item[aria-current="true"] + .edu-item{--sep:0;}
.edu-item[aria-current="true"]::after, .edu-item[aria-current="true"] + .edu-item::after{opacity:0;}
.edu-item[aria-current="true"]{background:var(--tint); color:#fff; font-weight:600;}
.edu-item .ico{width:20px; flex:none; display:inline-flex; justify-content:center; color:var(--tint);}
.edu-item[aria-current="true"] .ico{color:#fff;}

.edu-stage{display:grid; grid-template-rows:auto 1fr; min-height:0; min-width:0; overflow:hidden;}
.edu-tools{display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:.5px solid var(--separator); flex-wrap:wrap;}
.edu-tools h1{font-size:22px; font-weight:700; margin:0 0 0 4px; letter-spacing:.02em;}
.edu-count{font-size:15px; color:var(--label-3); margin-right:auto; font-variant-numeric:tabular-nums;}
/* 工具列控制項：無外框圖示按鈕，44pt 觸控範圍，同類放在同一個淡色膠囊裡 */
.grp{display:inline-flex; align-items:center; background:var(--fill); border-radius:999px; padding:2px;}
.grp > button{border:0; background:transparent; min-width:44px; min-height:40px; padding:0 12px; border-radius:999px;
  color:var(--tint); font-size:16px; font-weight:600; display:inline-flex; align-items:center; justify-content:center;}
.grp > button:hover{background:var(--fill);}
.grp > button[aria-pressed="true"]{background:var(--bg-elev); color:var(--label); box-shadow:0 2px 6px rgba(0,0,0,.1);}
.grp .nav svg.sym{width:20px; height:20px;}
.zoom-val{min-width:92px; text-align:center; font-size:15px; color:var(--label); font-variant-numeric:tabular-nums; cursor:default;}
.tbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 18px;
  border:0; border-radius:999px; background:var(--tint-fill); color:var(--tint); font-size:16px; font-weight:600;}
.tbtn:hover{background:var(--tint-fill-2);}
.tbtn.pri{background:var(--tint); color:#fff;}
.tbtn.pri:hover{background:var(--tint-pressed);}
.tbtn[aria-pressed="true"]{background:var(--tint); color:#fff;}

.edu-view{position:relative; overflow:auto; min-height:0; background:var(--bg-sunken); display:flex; padding:16px;}
.edu-view img{margin:auto; flex:none; display:block; height:auto; background:#fff; border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.08); user-select:none; -webkit-user-drag:none;}
.edu-view.pannable{cursor:grab;}
.edu-view.panning{cursor:grabbing;}
.edu-view .msg{margin:auto; color:var(--label-2);}

/* 最大化：頁面內最大化，不呼叫瀏覽器全螢幕（那會跳出無法關閉的系統提示）。要連網址列都隱藏，再按 F11。 */
body.edu-max .hub-bar, body.edu-max .hub-foot, body.edu-max .edu-rail{display:none;}
body.edu-max .hub-main{height:100dvh; grid-template-columns:1fr !important; grid-template-areas:"main" !important;}
body.edu-max #pane-calc{visibility:hidden !important;}
body.edu-max #pane-edu{grid-template-columns:1fr; padding:0; gap:0;}
body.edu-max .edu-stage{border-radius:0; box-shadow:none;}
body.edu-max .edu-view{background:#fff;}
body.edu-max .edu-view img{box-shadow:none;}

/* ── 列印表單 ── */
#pane-print{overflow:auto; padding:24px;}
.print-wrap{max-width:1200px; margin:0 auto;}
.print-head{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; padding:0 4px 16px;}
.print-head h1{font-size:28px; font-weight:700; margin:0;}
.print-head p{margin:0; color:var(--label-2); font-size:15px;}
.print-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
.ptile{display:flex; flex-direction:column; overflow:hidden;}
.ptile .thumb{aspect-ratio:210/297; background:var(--bg-sunken); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.ptile .thumb img{width:100%; height:100%; object-fit:cover; object-position:top;}
.ptile .thumb .ico{font-size:64px; color:var(--tint); opacity:.55;}
.ptile .body{padding:16px; display:flex; flex-direction:column; gap:8px; flex:1;}
.ptile h3{margin:0; font-size:17px; font-weight:600; line-height:1.35;}
.ptile .note{font-size:15px; color:var(--label-2);}
.ptile .acts{margin-top:auto; padding-top:8px;}
.ptile .acts .tbtn{width:100%;}

.hub-foot{height:var(--foot-h); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 24px;
  font-size:13px; color:var(--label-2); background:var(--bg-elev); border-top:.5px solid var(--separator-opaque); white-space:nowrap; overflow:hidden;}
.app-revision{font-size:12.5px; color:var(--label-3);}
.toast{position:fixed; left:50%; bottom:56px; transform:translateX(-50%); background:rgba(21,40,49,.92); color:#fff;
  padding:12px 22px; border-radius:999px; font-size:15px; z-index:50; box-shadow:0 8px 28px rgba(0,0,0,.2);
  animation:toast-in 300ms var(--ease);}
@keyframes toast-in{from{opacity:0; transform:translate(-50%,8px);}to{opacity:1; transform:translate(-50%,0);}}

/* QR 放大：hidden 屬性要能蓋過 display:flex，所以只在沒有 hidden 時才設 flex */
.qr-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60; align-items:center; justify-content:center;}
.qr-overlay:not([hidden]){display:flex;}
.qr-modal{background:var(--bg-elev); border-radius:20px; padding:24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:pop-in 300ms var(--ease);}
.qr-modal img{width:min(70vw,360px); display:block; border-radius:8px;}
.qr-modal p{margin:16px 0 0; font-size:17px; font-weight:600;}

/* 清除確認：系統提示框樣式，按鈕橫排，取消在前、破壞性動作在後 */
.modal{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:70; align-items:center; justify-content:center; padding:16px;}
.modal:not([hidden]){display:flex;}
.modal-card{background:var(--bg-elev); border-radius:14px; width:min(340px,100%); overflow:hidden; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop-in 300ms var(--ease);}
.modal-card h2{font-size:18px; font-weight:600; margin:20px 20px 6px;}
.modal-card p{margin:0 20px 6px; font-size:15px; color:var(--label);}
.modal-card p.sub{font-size:13px; color:var(--label-2); margin-bottom:20px;}
.modal-acts{display:grid; grid-template-columns:1fr 1fr; border-top:.5px solid var(--separator-opaque);}
.modal-acts button{min-height:48px; border:0; background:transparent; font-size:17px; color:var(--tint);}
.modal-acts button + button{border-left:.5px solid var(--separator-opaque);}
.modal-acts button:hover{background:var(--fill);}
.modal-acts .danger{color:var(--destructive); font-weight:600;}
@keyframes pop-in{from{opacity:0; transform:scale(1.08);}to{opacity:1; transform:none;}}

@media (max-width:1320px){
  #pane-edu{grid-template-columns:224px 1fr; gap:12px; padding:12px;}
  .edu-tools h1{font-size:20px;}
  .zoom-val{min-width:84px;}
  .hub-tab kbd{display:none;}
  .hub-tab{padding:0 16px;}
}
@media (max-width:1100px){
  .hub-brand{font-size:24px; letter-spacing:.03em;}
  .chip .k{display:none;}
}
/* ── 窄螢幕 ── */
@media (max-width:860px){
  :root{--bar-h:auto;}
  .hub-bar{flex-wrap:wrap; padding:8px 16px; gap:8px;}
  .hub-tabs{order:4; flex-basis:100%; overflow-x:auto;}
  .hub-tab{flex:1; padding:0 8px;}
  .hub-chips{order:5; flex-basis:100%; justify-content:flex-start;}
  .hub-main{height:calc(100dvh - 190px);}
  #pane-edu{grid-template-columns:1fr; grid-template-rows:auto 1fr; padding:8px; gap:8px;}
  .edu-rail{display:flex; overflow-x:auto; padding:6px;}
  .edu-rail .sec-title{display:none;}
  .edu-item{white-space:nowrap; width:auto;}
  .edu-item + .edu-item::after{display:none;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<header class="hub-bar">
  <button class="qr-btn" id="qr-btn" title="LINE 官方帳號 QR Code（點按放大）"><img id="qr-img" alt="LINE QR Code"></button>
  <div class="hub-brand">木子澄安診所</div>
  <nav class="hub-tabs" role="tablist" aria-label="切換工具">
    <button class="hub-tab press" role="tab" data-view="calc"   aria-selected="true">臨床計算<kbd>Alt+1</kbd></button>
    <button class="hub-tab press" role="tab" data-view="weight" aria-selected="false">減重報告<kbd>Alt+2</kbd></button>
    <button class="hub-tab press" role="tab" data-view="edu"    aria-selected="false">衛教圖卡<kbd>Alt+3</kbd></button>
    <button class="hub-tab press" role="tab" data-view="print"  aria-selected="false">列印表單<kbd>Alt+4</kbd></button>
  </nav>
  <div class="hub-chips" aria-live="polite">
    <button class="chip press" id="chip-calc" data-go="calc" hidden></button>
    <button class="chip press" id="chip-weight" data-go="weight" hidden></button>
  </div>
  <div class="hub-actions">
    <button class="btn press" id="btn-report-home" hidden><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>報告目錄</button>
    <button class="btn press" id="btn-split" aria-pressed="false" hidden title="衛教旁邊同時顯示臨床計算"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M14 4.5v15"/></svg>並排計算</button>
    <button class="btn clear press" id="btn-clear" title="換下一位病人時使用"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/></svg>全部清除</button>
  </div>
</header>

<main class="hub-main" id="hub-main" data-view="calc" data-split="0">
  <section class="pane" id="pane-calc"></section>
  <section class="pane" id="pane-weight"></section>

  <section class="pane" id="pane-edu">
    <nav class="edu-rail card" id="edu-rail" aria-label="衛教主題"></nav>
    <div class="edu-stage card">
      <div class="edu-tools">
        <h1 id="edu-title">衛教圖卡</h1>
        <span class="edu-count" id="edu-count"></span>
        <div class="grp">
          <button class="nav press" id="edu-prev" title="上一張（←）" aria-label="上一張"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button class="nav press" id="edu-next" title="下一張（→）" aria-label="下一張"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="grp">
          <button class="press" id="zoom-out" title="縮小（－ 鍵）" aria-label="縮小"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <span class="zoom-val" id="zoom-val" aria-live="polite">整頁</span>
          <button class="press" id="zoom-in" title="放大（＋ 鍵）" aria-label="放大"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div class="grp" role="group" aria-label="顯示方式">
          <button class="press" id="zoom-fit" title="整張圖放進畫面（0 鍵）" aria-pressed="true">整頁</button>
          <button class="press" id="zoom-width" title="圖片寬度填滿畫面（W 鍵）" aria-pressed="false">寬度</button>
        </div>
        <button class="tbtn press" id="edu-max" title="最大化（F 鍵，ESC 結束）"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-6.5 6.5M4 20l6.5-6.5"/></svg><span>最大化</span></button>
        <button class="tbtn pri press" id="edu-print"><svg class="sym" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 5 9h14a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19 17h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg>列印</button>
      </div>
      <div class="edu-view" id="edu-view" tabindex="-1"><div class="msg">載入中……</div></div>
    </div>
  </section>

  <section class="pane" id="pane-print">
    <div class="print-wrap">
      <div class="print-head">
        <h1>列印表單</h1>
        <p>全部以 A4 列印。</p>
      </div>
      <div class="print-grid" id="print-grid"></div>
    </div>
  </section>
</main>

<footer class="hub-foot">
  <div class="app-revision" id="app-revision"></div>
  <div id="foot-hint"></div>
</footer>

<div class="modal" id="clear-modal" role="dialog" aria-modal="true" aria-labelledby="cm-title" hidden>
  <div class="modal-card">
    <h2 id="cm-title">清除這位病人的資料？</h2>
    <p>「臨床計算」與「減重報告」畫面上的輸入與結果會全部清空。</p>

/* 衛教圖卡順序：工作台裡把「瘦瘦針注射與保存」接在「藥物選擇」後面 */
const EDU_AFTER = [['瘦瘦針注射與保存', '藥物選擇']];

const main = document.getElementById('hub-main');
const frames = {};
const revs = {};

function makeFrame(key){
  const f = document.createElement('iframe');
  f.title = TOOLS[key].title;
  f.src = TOOLS[key].url;
  f.addEventListener('load', ()=> hookFrame(key, f));
  document.getElementById('pane-' + key).appendChild(f);
  frames[key] = f;
}

/* ── 分頁切換 ── */
function setView(v){
  main.dataset.view = v;
  document.querySelectorAll('.hub-tab').forEach(b=> b.setAttribute('aria-selected', String(b.dataset.view === v)));
  document.getElementById('btn-split').hidden = (v !== 'edu');
  document.getElementById('btn-report-home').hidden = (v !== 'weight');
  document.getElementById('foot-hint').textContent = FOOT_HINT[v] || FOOT_HINT.calc;
  if(v === 'edu'){
    document.getElementById('edu-view').focus({preventScroll:true});
    setTimeout(applyZoom, 0);
  }
  // 頁面重新整理後回到同一個分頁
  store('hub-view', v);
  // 切換分頁時把焦點留在工作台，方向鍵與快捷鍵才不會被隱藏中的工具吃掉
  if(document.activeElement && document.activeElement.tagName === 'IFRAME') document.activeElement.blur();
}
const FOOT_HINT = {
  calc:   '以上結果僅供臨床參考，實際診斷與治療須由醫師綜合判斷。數值只在本機計算，不會上傳。',
  weight: '減重報告會自動暫存草稿；按「報告目錄」回到十個分項。',
  edu:    '← → 換張　＋ － 縮放　0 整頁　W 寬度　F 最大化　放大後可按住圖片拖曳',
  print:  '按「列印」會直接跳出列印對話框，紙張為 A4。'
};
// 個人瀏覽器的小設定（上次的分頁、衛教圖卡與縮放），讀不到就用預設值
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(err){} }
function recall(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; }catch(err){ return d; } }
document.querySelectorAll('.hub-tab').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.view)));
document.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.go)));
document.getElementById('btn-split').addEventListener('click', e=>{
  const on = main.dataset.split !== '1';
  main.dataset.split = on ? '1' : '0';
  e.currentTarget.setAttribute('aria-pressed', String(on));
});
document.getElementById('btn-report-home').addEventListener('click', ()=>{
  try{ frames.weight.contentWindow.showWorkflowHub(); }catch(err){}
});

function onHubKey(e){
  if(e.altKey && !e.ctrlKey && !e.metaKey){
    const v = {'1':'calc','2':'weight','3':'edu','4':'print'}[e.key];
    if(v){ e.preventDefault(); setView(v); return true; }
  }
  return false;
}
document.addEventListener('keydown', e=>{
  if(onHubKey(e)) return;
  if(!clearModal.hidden){
    if(e.key === 'Escape'){ e.preventDefault(); closeClear(); }
    return;
  }
  if(e.key === 'Escape' && !qrOverlay.hidden){ qrOverlay.hidden = true; return; }
  if(main.dataset.view !== 'edu' || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.closest && e.target.closest('input,textarea,select')) return;
  // 圖片放大後可捲動時，上下鍵留給捲動，換張只用左右鍵
  const canScroll = eduView.classList.contains('pannable');
  const k = e.key;
  if(k === 'ArrowLeft' || (k === 'ArrowUp' && !canScroll)){ e.preventDefault(); stepEdu(-1); }
  else if(k === 'ArrowRight' || (k === 'ArrowDown' && !canScroll)){ e.preventDefault(); stepEdu(1); }
  else if(k === '+' || k === '='){ e.preventDefault(); zoomStep(1); }
  else if(k === '-' || k === '_'){ e.preventDefault(); zoomStep(-1); }
  else if(k === '0'){ e.preventDefault(); setZoom('fit'); }
  else if(k === 'w' || k === 'W'){ e.preventDefault(); setZoom('width'); }
  else if(k === 'f' || k === 'F'){ e.preventDefault(); toggleMax(); }
  else if(k === 'Escape' && document.body.classList.contains('edu-max')){ e.preventDefault(); toggleMax(); }
});

/* ── 嵌入工具載入後：注入樣式、掛事件、讀資料 ── */
function hookFrame(key, f){
  let doc, win;
  try{ doc = f.contentDocument; win = f.contentWindow; if(!doc) return; }catch(err){ return; }
  const st = doc.createElement('style');
  st.textContent = SKIN[key];
  doc.head.appendChild(st);
  const upd = ()=> setTimeout(updateChips, 30);
  ['input','change','click'].forEach(t=> doc.addEventListener(t, upd, true));
  doc.addEventListener('keydown', onHubKey, true);
  const r = doc.getElementById('app-revision');
  revs[key] = r ? r.textContent.replace(/^最後改版：/, '').trim() : '';
  renderRevision();
  if(key === 'weight'){
    // 減重系統在工作台裡只負責製作報告：首頁不顯示，按返回或 ESC 都回到報告目錄
    try{
      win.goHome = ()=> win.showWorkflowHub();
      win.showWorkflowHub();
    }catch(err){}
    pullWeightData(win);
  }
  if(key === 'calc'){
    splitCalcPanels(doc);
    // 倍率只在載入與視窗大小改變時計算一次，所有工具共用，切換時字級不跳動
    calcZ = null;
    fitCalc();
    setTimeout(()=>{ calcZ = null; fitCalc(); }, 400);
    let rt = null;
    win.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ calcZ = null; fitCalc(); }, 120); });
    // 輸入過程不再改變倍率：少數狀態（例如欄位錯誤提示）超出畫面時，寧可短暫出現捲軸，也不讓全部字級跳動
  }
  updateChips();
}

/* 臨床計算自動縮放：所有工具共用同一個倍率，切換工具或分類時字級不會跳動。
   倍率取「每個工具都放得進畫面」的最大值：逐一量過每個工具（結果區全部展開的最壞情況），取最小者。
   量測在同一段同步程式內完成，畫面不會閃。
   降血脂與 B 肝用藥兩個判定表單題目很多，不列入計算、允許捲動，但字級與其他工具相同。 */
const CALC_SCROLL_OK = new Set(['panel-lipidrx', 'panel-hbvrx']);
const CALC_MIN_Z = 0.8, CALC_MAX_Z = 1.45;
let calcZ = null;

function calcCtx(){
  const f = frames.calc;
  let d;
  try{ d = f.contentDocument; }catch(err){ return null; }
  const card = d && d.querySelector('.card');
  if(!card || !f.clientHeight || !f.clientWidth) return null;
  return {f, d, card, root: d.documentElement, H: f.clientHeight, W: f.clientWidth};
}

// 在目前顯示狀態下，找出不出現捲軸的最大倍率（上限 hi）
function maxFit(c, hi){
  const fits = z=>{ c.card.style.zoom = z; return c.root.scrollHeight <= c.H; };
  if(fits(hi)) return hi;
  if(!fits(CALC_MIN_Z)) return CALC_MIN_Z;
  // 放大時版面變窄、換行變多，高度不是線性變化，用二分搜尋
  let lo = CALC_MIN_Z;
  for(let i = 0; i < 7; i++){
    const mid = (lo + hi) / 2;
    if(fits(mid)) lo = mid; else hi = mid;
  }
  return lo;
}

function computeCalcZ(c){
  const {d} = c;
  const panels = [...d.querySelectorAll('.tool-panel')];
  const saved = panels.map(p=> [p, p.hidden, p.classList.contains('active')]);
  const notice = d.getElementById('staff-notice'), summary = d.getElementById('summary-zone');
  const noticeHidden = notice ? notice.hidden : true, summaryHidden = summary ? summary.hidden : true;
  // 各分類的工具分頁列寬度不同，量測時換成該分類實際會出現的那一列
  const tabRows = [...d.querySelectorAll('.tabs[data-group]')];
  const tabRowsHidden = tabRows.map(r=> r.hidden);
  const calcBtn = d.getElementById('group-calc');
  const calcBtnHidden = calcBtn ? calcBtn.hidden : true;
  if(calcBtn) calcBtn.hidden = false;
  let z = Math.min(CALC_MAX_Z, Math.max(1, c.W / 1250));

  panels.filter(p=> !CALC_SCROLL_OK.has(p.id)).forEach(p=>{
    panels.forEach(x=>{ x.hidden = true; x.classList.remove('active'); });
    p.hidden = false; p.classList.add('active');
    // 依工具所屬分類，還原該分類會出現的提示列與「已完成的評估」欄
    const tab = d.getElementById('tab-' + p.id.replace('panel-', ''));
    const group = tab && tab.closest('.tabs') ? tab.closest('.tabs').dataset.group : '';
    tabRows.forEach(r=> r.hidden = r.dataset.group !== group);
    if(notice) notice.hidden = group !== 'calc';
    if(summary) summary.hidden = !(group === 'gi' || group === 'meta');
    // 結果區有的用行內 display:none、有的用 hidden 或 class 隱藏，一律以實際顯示狀態判斷，量完原樣還原
    const forced = [...p.querySelectorAll('.hub-out [id$="-result"]')]
      .filter(e=> getComputedStyle(e).display === 'none')
      .map(e=> ({e, v: e.style.getPropertyValue('display'), pr: e.style.getPropertyPriority('display'), h: e.hidden}));
    const hints  = [...p.querySelectorAll('.hub-out [id$="-hint"]')].filter(e=> e.style.display !== 'none');
    // 逐步放寬：先一般的 block（讓 BMI、TDEE 那幾條 !important 的排版規則照常生效），還是隱藏才加 !important
    forced.forEach(({e})=>{
      e.hidden = false;
      e.style.setProperty('display', 'block');
      if(getComputedStyle(e).display === 'none') e.style.setProperty('display', 'block', 'important');
    });
    hints.forEach(e=> e.style.display = 'none');
    z = Math.min(z, maxFit(c, z));
    forced.forEach(({e, v, pr, h})=>{
      if(v) e.style.setProperty('display', v, pr); else e.style.removeProperty('display');
      e.hidden = h;
    });
    hints.forEach(e=> e.style.display = '');
  });

  saved.forEach(([p, h, a])=>{ p.hidden = h; p.classList.toggle('active', a); });
  if(notice) notice.hidden = noticeHidden;
  if(summary) summary.hidden = summaryHidden;
  tabRows.forEach((r, i)=> r.hidden = tabRowsHidden[i]);
  if(calcBtn) calcBtn.hidden = calcBtnHidden;
  return z;
}

function fitCalc(){
  const c = calcCtx();
  if(!c) return;
  // 窄畫面（含並排模式）維持單欄原尺寸，允許捲動
  if(c.W < 1100){ c.card.style.zoom = 1; return; }
  if(calcZ === null) calcZ = computeCalcZ(c);
  c.card.style.zoom = calcZ;
}

// 面板尺寸一變（視窗縮放、切換並排、手機轉向）就重算共用倍率；
// 不只依賴 iframe 內的 resize 事件，某些情況下它不會觸發
{
  let t = null;
  const refit = ()=>{ clearTimeout(t); t = setTimeout(()=>{ calcZ = null; fitCalc(); }, 120); };
  new ResizeObserver(refit).observe(document.getElementById('pane-calc'));
  window.addEventListener('resize', refit);
}

/* 臨床計算的寬螢幕版面：每個工具分成左「輸入」、右「結果」兩欄，算完不必往下捲。
   只搬動既有元素的位置（id 與事件都不變），量表類工具題目多、結果在最後才出現，維持單欄。
   窄螢幕或並排模式時，CSS 會讓兩欄自動疊回單欄。 */
function splitCalcPanels(doc){
  // 附註放左欄、結果與對照表放右欄，兩欄高度較平均
  const isOut = c=> /-(result|hint)$/.test(c.id) || c.matches('.ref-table, .rx-cards');
  doc.querySelectorAll('.tool-panel').forEach(p=>{
    if(p.classList.contains('hub-split') || p.querySelector(':scope > .quiz-intro')) return;
    const kids = [...p.children].filter(c=> !c.classList.contains('panel-head'));
    if(!kids.some(isOut)) return;
    const L = doc.createElement('div'); L.className = 'hub-in';
    const R = doc.createElement('div'); R.className = 'hub-out';
    kids.forEach(c=> (isOut(c) ? R : L).appendChild(c));
    p.append(L, R);
    p.classList.add('hub-split');
  });
  // 結果欄捲動時停在分頁列下方
  const tw = doc.querySelector('.tabs-wrap');
  const setTop = ()=> doc.documentElement.style.setProperty('--hub-sticky', ((tw ? tw.offsetHeight : 0) + 14) + 'px');
  setTop();
  doc.defaultView.addEventListener('resize', setTop);
}

function txt(doc, id){ const el = doc && doc.getElementById(id); return el ? el.textContent.trim() : ''; }
function updateChips(){
  const cc = document.getElementById('chip-calc');
  const cw = document.getElementById('chip-weight');
  try{
    const d = frames.calc.contentDocument;
    const box = d && d.getElementById('bmi-result');
    const v = txt(d,'bmi-val');
    if(box && box.style.display !== 'none' && v && v !== '—'){
      cc.innerHTML = '<span class="k">臨床計算</span>BMI <b>' + esc(v) + '</b>　' + esc(txt(d,'bmi-badge'));
      cc.hidden = false;
    }else cc.hidden = true;
  }catch(err){ cc.hidden = true; }
  try{
    const d = frames.weight.contentDocument;
    const name = d && d.getElementById('p-name') ? d.getElementById('p-name').value.trim() : '';
    const bmi = txt(d,'bmi-value');
    const parts = [];
    if(name) parts.push(maskName(name));
    if(bmi && bmi !== '--' && bmi !== '—') parts.push('BMI <b>' + esc(bmi) + '</b>');
    if(parts.length){
      // 減重系統原本的「尚未儲存／已儲存」狀態在被隱藏的頁首裡，改顯示在這裡
      const st = txt(d,'status-pill');
      const saved = /^已儲存|^已載入/.test(st);
      cw.innerHTML = '<span class="k">減重報告</span>' + parts.join('　') +
        (st ? `<span class="save ${saved ? 'ok' : ''}">${saved ? '已儲存' : '未儲存'}</span>` : '');
      cw.hidden = false;
    }else cw.hidden = true;
  }catch(err){ cw.hidden = true; }
}
// 頂端列病人看得到，姓名只露第一個字
function maskName(n){ return esc(n.charAt(0)) + '○'.repeat(Math.max(1, Math.min(2, n.length - 1))); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let EDU = reorderEdu([

// 問卷由減重系統即時產生（含院所表頭），列印時呼叫它自己的函式
let FORMS = [
  {label:'減重門診評估問卷', note:'共 2 頁', pages:[], kind:'scales', icon:''},
  {label:'地中海飲食衛教', note:'共 2 頁', pages:[W('img/diet-mediterranean-1.jpg'), W('img/diet-mediterranean-2.jpg')], kind:'img'},
  {label:'健康紀錄表', note:'共 1 頁', pages:[W('img/health-record.jpg')], kind:'img'},

];
let eduIdx = 0;

function reorderEdu(list){
  const out = list.slice();
  EDU_AFTER.forEach(([move, after])=>{
    const i = out.findIndex(p=> p.label === move);
    if(i < 0 || !out.some(p=> p.label === after)) return;
    const [item] = out.splice(i, 1);
    out.splice(out.findIndex(p=> p.label === after) + 1, 0, item);
  });
  return out;
}

function pullWeightData(win){
  try{
    const list = win.eval('typeof EDU_PDF_PAGES !== "undefined" ? EDU_PDF_PAGES : null');
    if(Array.isArray(list) && list.length){
      const cur = EDU[eduIdx] && EDU[eduIdx].src;
      EDU = reorderEdu(list.map(p=>({label:p.label, src: W(p.src), printSplit: p.printSplit || 1, icon: p.icon || ''})));
      const keep = EDU.findIndex(p=> p.src === cur);
      eduIdx = keep >= 0 ? keep : 0;
      renderRail();
    }
  }catch(err){}
  try{
    const tiles = win.eval('typeof PRINT_TILES !== "undefined" ? PRINT_TILES : null');
    if(Array.isArray(tiles) && tiles.length){
      FORMS = tiles.map(t=>{
        const pages = (t.assets ? t.assets() : []).map(W);
        return {label:t.label, note:t.note, pages, kind: pages.length ? 'img' : 'scales', icon:t.icon || ''};
      });
      renderForms();
    }
  }catch(err){}
}

function showEdu(i){
  eduIdx = (i + EDU.length) % EDU.length;
  const p = EDU[eduIdx];

  document.getElementById('edu-count').textContent = (eduIdx + 1) + '／' + EDU.length;

  const img = eduView.querySelector('img');
  img.style.visibility = 'hidden';

  if(img.complete && img.naturalWidth) ready();
  else img.addEventListener('load', ready, {once:true});
  img.addEventListener('error', ()=>{ eduView.innerHTML = '<div class="msg">圖片載入失敗，請確認網路連線。</div>'; });

  const n = EDU[(eduIdx + 1) % EDU.length];
  if(n){ const pre = new Image(); pre.src = n.src; }

function stepEdu(d){ showEdu(eduIdx + d); }

/* ── 縮放：與減重系統相同的倍率，另外多一個「寬度」模式。
   'fit' 整張圖放進畫面、'width' 寬度填滿、數字為實際倍率。切換圖卡時沿用目前設定。 ── */
const eduView = document.getElementById('edu-view');
const ZOOM_STEPS = [0.25, 0.3, 0.4, 0.5, 0.6, 0.75, 0.9, 1, 1.25, 1.5, 2, 2.5, 3];
let eduZoom = recall('hub-edu-zoom', 'fit');
if(!(eduZoom === 'fit' || eduZoom === 'width' || typeof eduZoom === 'number')) eduZoom = 'fit';

function fitScale(img, mode){
  const aw = eduView.clientWidth - 32, ah = eduView.clientHeight - 32;
  return mode === 'width' ? aw / img.naturalWidth : Math.min(aw / img.naturalWidth, ah / img.naturalHeight);
}
function currentScale(){
  const img = eduView.querySelector('img');
  return (img && img.naturalWidth) ? img.getBoundingClientRect().width / img.naturalWidth : 1;
}
function applyZoom(){
  const img = eduView.querySelector('img');
  if(!img || !img.naturalWidth || !eduView.clientWidth) return;
  const s = typeof eduZoom === 'number' ? eduZoom : fitScale(img, eduZoom);
  img.style.width = Math.max(80, Math.round(img.naturalWidth * s)) + 'px';
  const pct = Math.round(s * 100) + '%';
  document.getElementById('zoom-val').textContent =
    eduZoom === 'fit' ? '整頁 ' + pct : eduZoom === 'width' ? '寬度 ' + pct : pct;
  document.getElementById('zoom-fit').setAttribute('aria-pressed', String(eduZoom === 'fit'));
  document.getElementById('zoom-width').setAttribute('aria-pressed', String(eduZoom === 'width'));
  eduView.classList.toggle('pannable',
    eduView.scrollWidth > eduView.clientWidth + 1 || eduView.scrollHeight > eduView.clientHeight + 1);
}
// 以畫面中心為基準縮放，放大後不會跳到左上角
function setZoom(z){
  const cx = (eduView.scrollLeft + eduView.clientWidth / 2) / Math.max(1, eduView.scrollWidth);
  const cy = (eduView.scrollTop + eduView.clientHeight / 2) / Math.max(1, eduView.scrollHeight);
  eduZoom = z;
  store('hub-edu-zoom', z);
  applyZoom();
  eduView.scrollLeft = cx * eduView.scrollWidth - eduView.clientWidth / 2;
  eduView.scrollTop = cy * eduView.scrollHeight - eduView.clientHeight / 2;
}
function zoomStep(dir){
  const cur = typeof eduZoom === 'number' ? eduZoom : currentScale();
  const next = dir > 0 ? ZOOM_STEPS.find(z=> z > cur + 0.01) : [...ZOOM_STEPS].reverse().find(z=> z < cur - 0.01);
  if(next !== undefined) setZoom(next);
}
function toggleMax(){
  const on = document.body.classList.toggle('edu-max');
  const b = document.getElementById('edu-max');
  b.querySelector('span').textContent = on ? '結束最大化' : '最大化';
  b.setAttribute('aria-pressed', String(on));
  setTimeout(applyZoom, 0);
}
window.addEventListener('resize', ()=>{ if(main.dataset.view === 'edu') applyZoom(); });

// Ctrl＋滾輪縮放；放大後按住圖片拖曳移動
eduView.addEventListener('wheel', e=>{
  if(!e.ctrlKey) return;
  e.preventDefault();
  zoomStep(e.deltaY < 0 ? 1 : -1);
}, {passive:false});
let pan = null;
eduView.addEventListener('pointerdown', e=>{
  if(e.button !== 0 || !eduView.classList.contains('pannable')) return;
  pan = {x:e.clientX, y:e.clientY, l:eduView.scrollLeft, t:eduView.scrollTop, id:e.pointerId};
  eduView.setPointerCapture(e.pointerId);
  eduView.classList.add('panning');
});
eduView.addEventListener('pointermove', e=>{
  if(!pan || e.pointerId !== pan.id) return;
  eduView.scrollLeft = pan.l - (e.clientX - pan.x);
  eduView.scrollTop = pan.t - (e.clientY - pan.y);
});
// 雙擊圖片在「整頁」與「寬度」之間切換
eduView.addEventListener('dblclick', ()=> setZoom(eduZoom === 'fit' ? 'width' : 'fit'));
['pointerup','pointercancel'].forEach(t=> eduView.addEventListener(t, ()=>{ pan = null; eduView.classList.remove('panning'); }));

document.getElementById('edu-prev').addEventListener('click', ()=> stepEdu(-1));
document.getElementById('edu-next').addEventListener('click', ()=> stepEdu(1));
document.getElementById('zoom-in').addEventListener('click', ()=> zoomStep(1));
document.getElementById('zoom-out').addEventListener('click', ()=> zoomStep(-1));
document.getElementById('zoom-fit').addEventListener('click', ()=> setZoom('fit'));
document.getElementById('zoom-width').addEventListener('click', ()=> setZoom('width'));
document.getElementById('edu-max').addEventListener('click', toggleMax);
document.getElementById('edu-print').addEventListener('click', ()=>{ const p = EDU[eduIdx]; printImages([p.src], p.label, p.printSplit); });

const FORM_ICON = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="18" rx="2"/><path d="M9 3.5h6v3H9zM8.5 11h7M8.5 14.5h7M8.5 18h4"/></svg>';
function renderForms(){

function printForm(t){

    catch(err){ toast('問卷要等減重系統載入完成才能列印，請稍候再試。'); }

/* ── 列印：A4、邊界 0，與減重系統原本的列印結果相同 ── */
const PAPER = {w:210, h:297};

function loadImg(src){
  return new Promise((ok, bad)=>{ const im = new Image(); im.onload = ()=> ok(im); im.onerror = bad; im.src = src; });
}
// 依圖片比例置中縮放；兩頁並列的圖（parts = 2）拆成兩張紙，與減重系統的列印方式相同
async function printImages(srcs, title, parts){
  let pages = '';
  try{
    for(const src of srcs){
      const img = await loadImg(src);
      const n = parts || 1;
      const ar = (img.naturalWidth / n) / img.naturalHeight;
      let w = PAPER.w, h = PAPER.w / ar;
      if(h > PAPER.h){ h = PAPER.h; w = PAPER.h * ar; }
      for(let k = 0; k < n; k++){
        pages += `<div class="pg"><div style="width:${w}mm;height:${h}mm;overflow:hidden">` +
          `<img src="${src}" style="display:block;width:${w*n}mm;height:${h}mm;margin-left:-${w*k}mm"></div></div>`;
      }
    }
  }catch(err){ toast('圖片載入失敗，無法列印。'); return; }
  printHtml(pages, title);
}

// 用隱藏 iframe 列印，只跳出列印對話框。@page margin 為 0，瀏覽器不會加上網址與日期的頁首頁尾。
function printHtml(body, title){
  const old = document.getElementById('print-frame');
  if(old) old.remove();
  const f = document.createElement('iframe');
  f.id = 'print-frame';
  f.style.cssText = 'position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;';
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open();
  d.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
    @page{size:A4 portrait;margin:0;}
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pg{width:${PAPER.w}mm;height:${PAPER.h}mm;display:flex;align-items:center;justify-content:center;
      overflow:hidden;break-after:page;page-break-after:always;}
    .pg:last-child{break-after:auto;page-break-after:auto;}
  </style></head><body>${body}</body></html>`);
  d.close();
  const imgs = [...d.images].filter(i=> !i.complete).map(i=> new Promise(r=>{ i.onload = i.onerror = r; }));
  const prevTitle = document.title;
  Promise.race([Promise.all(imgs), new Promise(r=> setTimeout(r, 15000))]).then(()=> setTimeout(()=>{
    document.title = title;
    f.contentWindow.focus();
    f.contentWindow.print();
    document.title = prevTitle;
    setTimeout(()=>{ if(f.parentNode) f.remove(); }, 60000);
  }, 80));
}

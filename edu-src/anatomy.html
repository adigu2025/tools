<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>衛教示意圖產生</title>
<!--
  衛教示意圖（門診衛教手繪用的線稿，2026-11-26 由「解剖圖稿」改名）：產生工作台「衛教示意圖」分類的 A5 圖。
  用法（在 tools 資料夾）：node kit/render-images.js anatomy
  原圖在 edu-src/anatomy/（2480 × 1748，A5 橫式，左右各一個器官）。
  做法：每張原圖從中間最寬的空白欄切成左右兩個器官，各自裁到線條邊界，
  在 A5 版面（A4 直式上半頁，2480 × 1754，300 dpi）裡左右各一格放到最大、置中。
  JOBS 的 scale 是放到最大之後再乘的倍數（左、右），縮小後仍在格子裡置中。
  四邊與中間留 10 mm。依 YT 2026-11-20 指示：不放頁首、頁尾、LINE QR code、LOGO。
  灰階（YT 2026-11-24）：黑線改成原本大腸圖中小腸線的灰（亮度約 200），原本的小腸淡線再淡一些（約 225）。
  做法見 toGray()：以「深度 = 255 − 亮度」計算，新深度 = GRAY_DARK ×（（舊深度 − GRAY_FLOOR）÷（255 − GRAY_FLOOR））^ GRAY_GAMMA。
  輸出的圖是整張 A4 直式（下半頁空白），跟其他 A5 衛教單同一套列印方式。
  SVG 原圖（JOBS 有 svg 的項目，2026-11-26 新增）：本來就是 A5 版面（viewBox 210 × 148.5 mm，邊距與灰線已畫好），
  不切左右、不調灰，直接畫滿 A4 上半頁。
-->
</head>
<body>
<script>
const JOBS = [
  {src: 'anatomy/upper-gi.png',      out: 'edu-a5-anatomy-upper-gi', scale: [0.75, 1]},   // 左邊上消化道縮成 75%（YT 2026-11-22）
  {src: 'anatomy/hepatobiliary.png', out: 'edu-a5-anatomy-hepatobiliary'},
  {svg: 'anatomy/muscle-fat.svg',     out: 'edu-a5-anatomy-muscle-fat'},   // 肌肉脂肪與代謝（2026-11-26）
  {svg: 'anatomy/glp1-pen.svg',       out: 'edu-a5-anatomy-glp1-pen'},     // 猛健樂週纖達用法（2026-11-26）
];
const PAGE_W = 2480, PAGE_H = 3508, A5_H = 1754;
const MM = 300 / 25.4, PAD = Math.round(10 * MM), GAP = Math.round(10 * MM);
const GRAY_DARK = 55, GRAY_GAMMA = 0.4, GRAY_FLOOR = 12;   // 深度 12 以下（原圖壓縮雜點）直接當白底，避免放大成灰點
   // 黑線 → 亮度 255 − 55 = 200；小腸線（原亮度約 203）→ 約 225
const INK = 235;   // 亮度低於這個值算線條（小腸的淡灰線也要算進去）

const load = src=> new Promise((r, j)=>{ const im = new Image(); im.onload = ()=> r(im); im.onerror = j; im.src = src; });
// 線條遮罩：逐欄、逐列記錄有沒有線條
function inkMap(im){
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const ink = new Uint8Array(c.width * c.height);
  for(let i = 0; i < ink.length; i++){
    const k = i * 4, y = 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2];
    ink[i] = y < INK ? 1 : 0;
  }
  return {w: c.width, h: c.height, ink};
}
function bbox(m, x0, x1){
  let l = 1e9, r = -1, t = 1e9, b = -1;
  for(let y = 0; y < m.h; y++) for(let x = x0; x < x1; x++) if(m.ink[y * m.w + x]){
    if(x < l) l = x; if(x > r) r = x; if(y < t) t = y; if(y > b) b = y;
  }
  return r < 0 ? null : {x: l, y: t, w: r - l + 1, h: b - t + 1};
}
// 中間三分之一裡最長的空白欄區段，取中點當左右分界
function splitX(m){
  const col = new Uint8Array(m.w);
  for(let x = 0; x < m.w; x++){ for(let y = 0; y < m.h; y++) if(m.ink[y * m.w + x]){ col[x] = 1; break; } }
  let best = [0, 0], s = -1;
  for(let x = Math.floor(m.w / 3); x <= Math.ceil(m.w * 2 / 3); x++){
    if(!col[x] && s < 0) s = x;
    if((col[x] || x === Math.ceil(m.w * 2 / 3)) && s >= 0){ if(x - s > best[1] - best[0]) best = [s, x]; s = -1; }
  }
  if(best[1] - best[0] < 20) throw new Error('找不到左右器官之間的空白');
  return Math.round((best[0] + best[1]) / 2);
}
// 整張改成灰階並調淡線條
function toGray(c){
  const g = c.getContext('2d'), img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  const lut = new Uint8ClampedArray(256);
  for(let a = 0; a < 256; a++) lut[a] = 255 - GRAY_DARK * Math.pow(Math.max(0, a - GRAY_FLOOR) / (255 - GRAY_FLOOR), GRAY_GAMMA);
  for(let k = 0; k < d.length; k += 4){
    const v = lut[255 - Math.round(0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2])];
    d[k] = d[k + 1] = d[k + 2] = v;
  }
  g.putImageData(img, 0, 0);
}
async function build(job){
  if(job.svg) return buildSvg(job);
  const im = await load(job.src);
  const m = inkMap(im), mid = splitX(m);
  const parts = [bbox(m, 0, mid), bbox(m, mid, m.w)];
  const cellW = (PAGE_W - PAD * 2 - GAP) / 2, cellH = A5_H - PAD * 2;
  const c = document.createElement('canvas'); c.width = PAGE_W; c.height = PAGE_H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, PAGE_W, PAGE_H);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const info = [];
  parts.forEach((b, i)=>{
    const s = Math.min(cellW / b.w, cellH / b.h) * (job.scale ? job.scale[i] : 1);
    const w = b.w * s, h = b.h * s;
    const x = PAD + i * (cellW + GAP) + (cellW - w) / 2, y = PAD + (cellH - h) / 2;
    g.drawImage(im, b.x, b.y, b.w, b.h, x, y, w, h);
    info.push(`${i ? '右' : '左'} ×${s.toFixed(2)}`);
  });
  toGray(c);
  return {canvas: c, info: info.join('，')};
}
// SVG 原圖已是 A5 版面：畫滿 A4 上半頁，下半頁白底
async function buildSvg(job){
  const im = await load(job.svg);
  const c = document.createElement('canvas'); c.width = PAGE_W; c.height = PAGE_H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, PAGE_W, PAGE_H);
  g.drawImage(im, 0, 0, PAGE_W, A5_H);
  return {canvas: c, info: 'SVG 畫滿 A5'};
}
async function renderAll(only){
  const log = [];
  for(const job of JOBS){
    if(only && !only.includes(job.out)) continue;
    const {canvas, info} = await build(job);
    const webp = await new Promise(r=> canvas.toBlob(r, 'image/webp', 0.92));
    await fetch('/__save?name=' + job.out + '.webp', {method: 'POST', body: webp});
    log.push(job.out + '：' + info);
  }
  return log.join('\n');
}
</script>
</body>
</html>

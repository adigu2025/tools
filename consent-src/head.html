<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>木子澄安診所同意書</title>
<!-- 七份同意書的版面原始檔。每頁 A4 直式 794 × 1123，黑白列印版；輸出方式見 README.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 黑白列印版：只用黑、灰、白 */
    --ink:#000; --gold:#333; --sub:#555; --line:#BBB; --shade:#F2F2F2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#9AA5AA;color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:14.2px;line-height:1.6}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px}
  .page{width:794px;height:1123px;background:#fff;padding:42px 58px 34px;display:flex;flex-direction:column;position:relative;overflow:hidden}

  /* 頁首：診所標誌在左，同意書名稱置中 */
  .head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:3px solid var(--ink)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{height:50px;display:block}
  .brand b{display:block;font-family:'Noto Serif TC',serif;font-weight:600;font-size:19px;line-height:1.2;color:#3a3a3a}
  .brand small{display:block;font-family:'Noto Serif TC',serif;font-weight:600;font-size:7.5px;letter-spacing:.06em;color:#3a3a3a}
  .head .info{text-align:right;font-size:11px;color:var(--sub);line-height:1.55}
  .title{text-align:center;margin:12px 0 2px}
  .title h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:26px;letter-spacing:.08em;line-height:1.3}
  .title p{font-size:13px;color:var(--sub);letter-spacing:.1em}

  h2{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;margin:11px 0 5px}
  h2 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:14px;flex-shrink:0}
  h2 small{font-size:12.5px;font-weight:500;color:var(--sub)}
  h3{font-size:14.5px;font-weight:700;margin:8px 0 3px}

  ol.items{list-style:none;counter-reset:n}
  ol.items > li{counter-increment:n;position:relative;padding-left:22px;margin-bottom:4px}
  ol.items > li::before{content:counter(n) ".";position:absolute;left:0;font-weight:700}
  ul.dots{list-style:none}
  ul.dots > li{position:relative;padding-left:16px;margin-bottom:4px}
  ul.dots > li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .k{font-weight:700}
  .note{font-size:12.5px;color:var(--sub)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .side{display:grid;grid-template-columns:1fr 190px;gap:16px;align-items:start}
  .side img{width:100%;display:block}

  /* 灰底框：預約、押金、急診提醒 */
  .boxed{border:1.3px solid var(--line);border-radius:6px;background:var(--shade);padding:8px 14px}
  .boxed.dark{background:#fff;border:1.8px solid var(--ink)}

  /* 費用 */
  .fees{display:flex;gap:14px;margin:4px 0 2px}
  .fee{flex:1;border:1.8px solid var(--gold);border-radius:6px;padding:6px 10px;text-align:center}
  .fee .t{font-size:12.5px;color:var(--sub);letter-spacing:.08em}
  .fee .v{font-size:16px;font-weight:700}
  .fee .v em{font-style:normal;font-family:'Noto Serif TC',serif;font-weight:900;font-size:23px}
  .fee .n{font-size:11.5px;color:var(--sub)}

  /* 自費選項卡：圖、名稱、內容、價格，左上角勾選框 */
  .opts{display:grid;gap:12px}
  .opt{border:1.3px solid var(--line);border-radius:6px;padding:8px 10px 7px;position:relative;display:flex;flex-direction:column}
  .opt img{display:block;margin:0 auto 5px;max-width:100%}
  .opt .nm{font-weight:700;font-size:14.5px;line-height:1.4}
  .opt .ct{font-size:12px;color:var(--sub);line-height:1.5}
  .opt .pr{margin-top:auto;text-align:right;font-size:13px;padding-top:3px}
  .opt .pr em{font-style:normal;font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px}
  .opt.row{flex-direction:row;align-items:center;gap:12px}
  .opt.row .tx{flex:1;display:flex;flex-direction:column;align-self:stretch}
  .box{display:inline-block;width:15px;height:15px;border:1.6px solid var(--ink);vertical-align:-2px;margin-right:6px;background:#fff}

  /* 同意與簽名 */
  .agree{border:1.3px solid var(--line);border-radius:6px;padding:9px 14px 10px;margin-top:6px}
  .agree p{margin-bottom:4px}
  .agree .salute{text-indent:2em;margin:2px 0 0}
  .rec{font-size:11.5px;color:var(--sub);margin-top:8px}
  .final{border:2.2px solid var(--ink);padding:6px 14px 9px;margin-top:5px}
  .row{display:flex;align-items:flex-end;gap:12px;margin:7px 0}
  .f{display:flex;align-items:flex-end;gap:3px;white-space:nowrap;flex:1}
  .f span.l{flex:1;border-bottom:1.2px solid var(--ink);min-width:50px;height:22px}
  .date{text-align:right;letter-spacing:.5em;margin-top:6px}

  table.tb{width:100%;border-collapse:collapse;font-size:13px}
  table.tb th,table.tb td{border:1px solid #999;padding:4px 8px;text-align:center;vertical-align:middle}
  table.tb th{background:var(--shade);font-weight:700}
  table.tb td.l{text-align:left}

  .foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:auto;padding-top:5px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
